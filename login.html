  // Auto-redirect if already logged in (either persistent or session)
  (function(){
    const ls = localStorage.getItem("cmms_user");
    const ss = sessionStorage.getItem("cmms_user");
    if(ls || ss){ window.location.replace("index.html"); }

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Poppins',Arial,sans-serif}
body{
  background:linear-gradient(135deg,#0a2e5c 0%,#0f4c81 60%,#1565c0 100%);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding:16px;
}

/* ── Header ─────────────────────────────────────────────── */
.header{
  width:100%;max-width:480px;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;margin-bottom:28px;
  background:rgba(255,255,255,.08);border-radius:16px;
  border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);
}
.header img{height:42px;object-fit:contain}
.header-center{text-align:center;flex:1;padding:0 10px}
.header-center h1{font-size:13px;font-weight:900;color:#fff;
  text-transform:uppercase;letter-spacing:.04em}
.header-center p{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px;font-weight:600}

/* ── Login Card ──────────────────────────────────────────── */
.login-card{
  width:100%;max-width:420px;
  background:linear-gradient(145deg,#ffffff,#f0f4f9);
  border-radius:22px;padding:36px 32px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  border:2px solid rgba(255,255,255,.5);
  position:relative;overflow:hidden;
  animation:slideUp .5s ease forwards;
}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,#0a2e5c,#00b4d8);
}

.login-title{
  font-size:22px;font-weight:900;color:#0a2e5c;
  text-transform:uppercase;letter-spacing:.04em;
  margin-bottom:4px;text-align:center;
}
.login-sub{
  font-size:11px;font-weight:700;color:#607d9f;
  text-transform:uppercase;letter-spacing:.12em;
  text-align:center;margin-bottom:28px;
}

/* ── Role Toggle ─────────────────────────────────────────── */
.role-toggle{
  display:flex;background:#e8edf3;border-radius:12px;
  padding:4px;margin-bottom:24px;gap:4px;
}
.role-btn{
  flex:1;padding:10px 8px;border:none;background:transparent;
  border-radius:9px;font-family:'Poppins',sans-serif;
  font-size:12px;font-weight:700;color:#607d9f;
  text-transform:uppercase;letter-spacing:.06em;cursor:pointer;
  transition:all .25s ease;
}
.role-btn.active{
  background:linear-gradient(135deg,#0a2e5c,#1565c0);
  color:#fff;box-shadow:0 4px 14px rgba(10,46,92,.35);
}

/* ── Form Fields ─────────────────────────────────────────── */
.field-group{margin-bottom:16px}
.field-label{
  display:block;font-size:11px;font-weight:800;
  color:#0a2e5c;text-transform:uppercase;letter-spacing:.1em;
  margin-bottom:7px;
}
.field-input{
  width:100%;padding:13px 16px;border-radius:12px;
  border:2px solid #d0dce9;background:#fff;
  font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;
  color:#1a2e4a;outline:none;transition:border-color .2s,box-shadow .2s;
  -webkit-appearance:none;
}
.field-input:focus{
  border-color:#0f4c81;
  box-shadow:0 0 0 4px rgba(15,76,129,.12);
}
.field-input::placeholder{color:#b0c0d0;font-weight:500}

/* ── Keep Me Logged In ───────────────────────────────────── */
.remember-row{
  display:flex;align-items:center;gap:10px;margin-top:4px;margin-bottom:2px;
  cursor:pointer;user-select:none;
}
.remember-row input[type=checkbox]{
  width:18px;height:18px;accent-color:#0a2e5c;cursor:pointer;
  border-radius:4px;flex-shrink:0;
}
.remember-label{
  font-size:12px;font-weight:700;color:#607d9f;
  text-transform:uppercase;letter-spacing:.06em;
}

/* ── Login Button ────────────────────────────────────────── */
.login-btn{
  width:100%;margin-top:22px;padding:15px;
  background:linear-gradient(135deg,#0a2e5c 0%,#1565c0 100%);
  color:#fff;border:none;border-radius:14px;
  font-family:'Poppins',sans-serif;font-size:14px;font-weight:800;
  text-transform:uppercase;letter-spacing:.1em;cursor:pointer;
  box-shadow:0 8px 24px rgba(10,46,92,.4);
  transition:transform .15s,box-shadow .15s,background .2s;
}
.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(10,46,92,.5);
}
.login-btn:active{transform:translateY(0);box-shadow:0 4px 12px rgba(10,46,92,.3)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* ── Messages ────────────────────────────────────────────── */
.msg{
  display:none;margin-top:16px;padding:12px 16px;border-radius:12px;
  font-size:13px;font-weight:700;text-align:center;
}
.msg.error{background:#fde8e8;color:#c0392b;border:1px solid #f5b7b1}
.msg.success{background:#e8f8f0;color:#1a7a4a;border:1px solid #a9dfbf}

/* ── Footer ──────────────────────────────────────────────── */
.footer{
  margin-top:28px;text-align:center;
  font-size:11px;font-weight:700;color:rgba(255,255,255,.45);
  text-transform:uppercase;letter-spacing:.08em;line-height:1.7;
}
.footer a{color:#00d4ff;text-decoration:none}

/* ── Lock Icon ───────────────────────────────────────────── */
.lock-icon{
  width:56px;height:56px;background:linear-gradient(135deg,#0a2e5c,#1565c0);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;box-shadow:0 8px 24px rgba(10,46,92,.4);
}
.lock-icon svg{width:26px;height:26px;fill:#fff}

/* ── Loading spinner ─────────────────────────────────────── */
.spinner{
  display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

  /* ── PWA Install Banner ──────────────────────────────── */
  #installBanner{
    display:none;
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,#00b4d8 0%,#0077b6 100%);
    color:#fff;border:none;border-radius:50px;
    padding:13px 30px;font-size:13px;font-weight:700;letter-spacing:.08em;
    cursor:pointer;box-shadow:0 8px 28px rgba(0,180,216,.55);
    z-index:9999;white-space:nowrap;font-family:inherit;

  }
  @keyframes installPulse{
    0%,100%{box-shadow:0 8px 28px rgba(0,180,216,.55);transform:translateX(-50%) scale(1)}
    50%{box-shadow:0 8px 40px rgba(0,180,216,.85);transform:translateX(-50%) scale(1.03)}
  }
  #installBanner:active{transform:translateX(-50%) scale(.97)!important}
</style>

<script>

// ── ENGINEERS ──────────────────────────────────────────────
// Paste your Engineer block here (from convert_excel.py output)
const ENGINEERS = [
      { iqama: "1107068478", file: "122322", name: "يزيد سعود ردة الربيعي" },
      { iqama: "2337227264", file: "123068", name: "احمد محمد مسعد ابراهيم" },
      { iqama: "1106947334", file: "128262", name: "محمد عبد الرحمن معيض الثقفي" },
      { iqama: "2358072466", file: "123310", name: "احمد محروس محمد جويلي" },
];

// ── Page to open after successful login ───────────────────
const DASHBOARD_URL = "index.html";   // ← your main dashboard

// ══════════════════════════════════════════════════════════
//   DO NOT EDIT BELOW THIS LINE
// ══════════════════════════════════════════════════════════

let currentRole = "technician";

// Normalize: convert to string, remove all spaces, lowercase
function norm(v) {
  return String(v === null || v === undefined ? "" : v).replace(/\s+/g, "").toLowerCase();
}

function setRole(role) {
  currentRole = role;
  document.getElementById("btn-tech").classList.toggle("active", role === "technician");
  document.getElementById("btn-eng").classList.toggle("active",  role === "engineer");
  hideMessages();
}

function hideMessages() {
  document.getElementById("errorMsg").style.display   = "none";
  document.getElementById("successMsg").style.display = "none";
  document.getElementById("debugMsg").style.display   = "none";
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.innerHTML = msg;
  el.style.display = "block";
  document.getElementById("successMsg").style.display = "none";
  const card = document.querySelector(".login-card");
  card.style.animation = "none";
  card.offsetHeight;
  card.style.animation = "shake .4s ease";
}

// Add shake keyframe dynamically
(function(){
  const s = document.createElement("style");
  s.textContent = "@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}";
  document.head.appendChild(s);
})();

function doLogin() {
  const iqamaRaw = document.getElementById("iqama").value;
  const fileRaw  = document.getElementById("file").value;
  const iqama    = norm(iqamaRaw);
  const file     = norm(fileRaw);
  const btn      = document.getElementById("loginBtn");

  hideMessages();

  if (!iqama) { showError("⚠ Please enter your Iqama Number."); return; }
  if (!file)  { showError("⚠ Please enter your File Number.");  return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Checking...';

  setTimeout(() => {
    const list  = currentRole === "technician" ? TECHNICIANS : ENGINEERS;

    // Robust match: normalize both sides before comparing
    const match = list.find(u => norm(u.iqama) === iqama && norm(u.file) === file);

    if (match) {
      const name = match.name || (currentRole === "technician" ? "Technician" : "Engineer");
      const el = document.getElementById("successMsg");
      el.innerHTML = "✅ Welcome, <strong>" + name + "</strong>! Redirecting…";
      el.style.display = "block";

      const remember = document.getElementById("rememberMe").checked;
      const store = remember ? localStorage : sessionStorage;

      // Clear both first so no stale data remains
      localStorage.removeItem("cmms_user");  localStorage.removeItem("cmms_role");  localStorage.removeItem("cmms_iqama");
      sessionStorage.removeItem("cmms_user"); sessionStorage.removeItem("cmms_role"); sessionStorage.removeItem("cmms_iqama");

      store.setItem("cmms_user",  name);
      store.setItem("cmms_role",  currentRole);
      store.setItem("cmms_iqama", iqama);

      setTimeout(() => { window.location.href = DASHBOARD_URL; }, 1200);
    } else {
      btn.disabled = false;
      btn.innerHTML = "LOGIN →";

      // ── Helpful debug: tell user exactly what was NOT found ──
      const iqamaOnly = list.find(u => norm(u.iqama) === iqama);
      const fileOnly  = list.find(u => norm(u.file)  === file);

      let hint = "";
      if (!iqamaOnly && !fileOnly) {
        hint = "<br><small>Neither Iqama nor File Number was found in the " + currentRole + " list.<br>Check the role (Technician / Engineer) and your data arrays.</small>";
      } else if (iqamaOnly && !fileOnly) {
        hint = "<br><small>Iqama found ✓ — but File Number <b>" + fileRaw.trim() + "</b> did not match.<br>Expected: <b>" + iqamaOnly.file + "</b></small>";
      } else if (!iqamaOnly && fileOnly) {
        hint = "<br><small>File Number found ✓ — but Iqama <b>" + iqamaRaw.trim() + "</b> did not match.</small>";
      } else {
        hint = "<br><small>Both found separately, but not as a matching pair. Check the correct combination.</small>";
      }

      showError("❌ Login failed. " + hint);
    }
  }, 600);
}

// Allow Enter key to submit
document.addEventListener("keydown", function(e) {
  if (e.key === "Enter") doLogin();
});

// Auto-clear messages when user types
["iqama","file"].forEach(id => {
  document.getElementById(id).addEventListener("input", hideMessages);
});

</script>
    <script>
      /* ── PWA Install Prompt ───────────────────────────── */
      let _deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        _deferredPrompt = e;
        var btn = document.getElementById('installBanner');
        if (btn) { btn.style.display = 'block'; }
      });
      function installPWA() {
        if (!_deferredPrompt) return;
        _deferredPrompt.prompt();
        _deferredPrompt.userChoice.then(function() {
          _deferredPrompt = null;
          var btn = document.getElementById('installBanner');
          if (btn) { btn.style.display = 'none'; }
        });
      }
      window.addEventListener('appinstalled', function() {
        _deferredPrompt = null;
        var btn = document.getElementById('installBanner');
        if (btn) { btn.style.display = 'none'; }
      });
      /* Already running as installed PWA? Hide button */
      if (window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true) {
        window.addEventListener('DOMContentLoaded', function() {
          var btn = document.getElementById('installBanner');
          if (btn) btn.style.display = 'none';
        });
      }
    </script>


    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js')
            .then(function (reg) { console.log('SW registered:', reg.scope); })
            .catch(function (err) { console.warn('SW registration failed:', err); });
        });
      }
    </script>

<button id="installBanner" onclick="installPWA()">📲 Install App</button>
