<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>CMMS — King Faisal Medical Complex</title>
<meta name="description" content="CMMS dashboard for King Faisal Medical Complex — HVAC, inventory, approvals." />
<link rel="manifest" href="/PWA/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CMMS KFMC">
<link rel="apple-touch-icon" href="/PWA/icons/icon-192x192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030712">
<meta name="application-name" content="CMMS KFMC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','ui-sans-serif','system-ui'] } } } };
</script>
<style>
  :root { color-scheme: dark; }
  html, body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background:#030712; color:#fff; }
  /* Lucide-style icon sizing */
  .icon { width:18px; height:18px; stroke-width:2; }
  /* Route transition */
  @keyframes slideIn { from { transform: translateX(24px); opacity: 0 } to { transform: none; opacity: 1 } }
  .route-enter { animation: slideIn .18s ease-in-out both; }
  /* Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px }
  /* Safe areas */
  .safe-top { padding-top: env(safe-area-inset-top) }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom) }
</style>
</head>
<body class="bg-gray-950 text-white">

<div id="app" class="min-h-screen flex safe-top">

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 border-r border-white/10 flex flex-col transform -translate-x-full transition-transform duration-300 lg:translate-x-0 lg:static lg:flex safe-top">
    <!-- Logo -->
    <div class="p-5 border-b border-white/10">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-lg">⚙️</div>
        <div>
          <p class="font-bold text-white text-sm leading-tight">CMMS System</p>
          <p class="text-cyan-400/70 text-xs">King Faisal Medical</p>
        </div>
      </div>
    </div>

    <!-- User -->
    <div class="p-4 border-b border-white/10">
      <div class="flex items-center gap-2 px-3 py-2 rounded-xl border bg-cyan-500/20 text-cyan-300 border-cyan-400/30">
        <span>🔧</span>
        <div class="min-w-0">
          <p class="text-xs font-semibold truncate">Maintenance Team</p>
          <p class="text-xs opacity-70 capitalize">technician</p>
        </div>
      </div>
    </div>

    <!-- Nav -->
    <nav id="sideNav" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>

    <!-- Bottom -->
    <div class="p-3 border-t border-white/10 space-y-1">
      <button onclick="openDelete()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-red-500/80 hover:bg-red-500/10 transition-all">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>Delete Account</span>
      </button>
      <button onclick="confirmLogout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-red-400 hover:bg-red-500/10 transition-all">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Overlay -->
  <div id="overlay" class="fixed inset-0 z-40 bg-black/50 hidden lg:hidden" onclick="closeSidebar()"></div>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top bar -->
    <header class="bg-gray-900/90 backdrop-blur-sm border-b border-white/10 flex items-center px-3 gap-2 sticky top-0 z-30 h-14">
      <button id="backBtn" onclick="goBack()" class="hidden lg:hidden items-center gap-1 p-2 rounded-lg hover:bg-white/10 text-cyan-300">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span class="text-sm font-medium">Back</span>
      </button>
      <button id="menuBtn" onclick="openSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-white/10">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="flex-1 text-sm text-white/50 hidden sm:block truncate">
        King Faisal Medical Complex — AL MAJAL AL ARABI GROUP
      </div>
      <button onclick="toggleNotif()" class="relative p-2 rounded-lg hover:bg-white/10">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span id="notifDot" class="hidden absolute top-1 right-1 min-w-[16px] h-4 px-1 text-[10px] font-bold bg-red-500 text-white rounded-full grid place-items-center"></span>
      </button>
      <div class="flex items-center gap-2 text-sm text-white/70"><span>🔧</span><span class="hidden sm:inline">Tech</span></div>
    </header>

    <!-- Notification panel -->
    <div id="notifPanel" class="hidden absolute right-3 top-14 mt-1 w-80 max-w-[95vw] bg-gray-900 border border-white/10 rounded-2xl shadow-2xl z-40 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
        <p class="font-semibold text-sm">Pending Material Requests</p>
        <button onclick="markAllRead()" class="text-xs text-cyan-400 hover:text-cyan-300">Mark all read</button>
      </div>
      <div id="notifList" class="max-h-80 overflow-y-auto divide-y divide-white/5 text-sm"></div>
    </div>

    <!-- Page content -->
    <main id="page" class="flex-1 overflow-auto p-4 lg:p-6 pb-24 lg:pb-6 route-enter" style="padding-bottom: calc(5rem + env(safe-area-inset-bottom))"></main>
  </div>

  <!-- Bottom Tab Nav -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-gray-900/95 backdrop-blur-lg border-t border-white/10 flex safe-bottom" id="tabNav"></nav>
</div>

<!-- Delete dialog -->
<div id="deleteDlg" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-black/70 p-4">
  <div class="bg-gray-900 border border-red-500/30 rounded-2xl w-full max-w-sm p-6">
    <div class="flex items-center gap-3 mb-4">
      <div class="p-3 bg-red-500/20 rounded-xl">
        <svg class="icon text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div>
        <h3 class="font-bold text-white">Delete Account</h3>
        <p class="text-white/50 text-xs">This action cannot be undone</p>
      </div>
    </div>
    <p class="text-white/70 text-sm mb-4">Type <span class="text-red-400 font-mono font-bold">DELETE</span> to confirm.</p>
    <input id="delInput" type="text" placeholder='Type "DELETE" to confirm' oninput="document.getElementById('delBtn').disabled=this.value!=='DELETE'"
      class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white placeholder-white/30 focus:outline-none focus:border-red-400 mb-4"/>
    <div class="flex gap-3">
      <button onclick="closeDelete()" class="flex-1 py-2.5 rounded-xl border border-white/20 text-white/60 hover:text-white text-sm">Cancel</button>
      <button id="delBtn" disabled onclick="closeDelete()" class="flex-1 py-2.5 rounded-xl bg-red-500/80 hover:bg-red-500 disabled:opacity-30 disabled:cursor-not-allowed text-white font-bold text-sm">Delete</button>
    </div>
  </div>
</div>

<!-- Logout dialog -->
<div id="logoutDlg" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-black/70 p-4">
  <div class="bg-gray-900 border border-white/10 rounded-2xl w-full max-w-sm p-6">
    <h3 class="font-bold text-white mb-2">Logout</h3>
    <p class="text-white/60 text-sm mb-5">Are you sure you want to log out?</p>
    <div class="flex gap-3">
      <button onclick="document.getElementById('logoutDlg').classList.add('hidden')" class="flex-1 py-2.5 rounded-xl border border-white/20 text-white/60 hover:text-white text-sm">Cancel</button>
      <button onclick="doLogout()" class="flex-1 py-2.5 rounded-xl bg-red-500/80 hover:bg-red-500 text-white font-bold text-sm">Logout</button>
    </div>
  </div>
</div>

<!-- System iframe view -->
<div id="systemView" class="hidden fixed inset-0 z-[150] bg-gray-950 flex flex-col">
  <div class="h-14 flex items-center px-3 border-b border-white/10 bg-gray-900">
    <button onclick="closeSystem()" class="flex items-center gap-1 p-2 rounded-lg hover:bg-white/10 text-cyan-300">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span class="text-sm font-medium">Back to Dashboard</span>
    </button>
    <div class="flex-1 text-center text-sm text-white/60" id="systemTitle"></div>
    <div class="w-24"></div>
  </div>
  <iframe id="systemFrame" class="flex-1 w-full bg-white" src="about:blank"></iframe>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDr9meYf-fKn7i-3NeQxfSnXNTs-4HGJyE",
    authDomain: "hvac-ppm.firebaseapp.com",
    projectId: "hvac-ppm",
    storageBucket: "hvac-ppm.appspot.com",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:0000000000000000000000"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window._notifs = [];
  function renderBadge(n) {
    const dot = document.getElementById('notifDot');
    if (n > 0) { dot.textContent = n > 99 ? '99+' : n; dot.classList.remove('hidden'); }
    else dot.classList.add('hidden');
  }
  function renderList() {
    const el = document.getElementById('notifList');
    if (!window._notifs.length) { el.innerHTML = '<div class="p-6 text-center text-white/40 text-sm">No pending requests</div>'; return; }
    el.innerHTML = window._notifs.map(r => `
      <div class="p-3 hover:bg-white/5">
        <div class="flex justify-between gap-2">
          <p class="font-medium text-white truncate">${r.material || r.title || 'Material Request'}</p>
          <span class="text-[10px] text-yellow-300 bg-yellow-500/10 border border-yellow-400/30 rounded px-1.5 py-0.5">Pending</span>
        </div>
        <p class="text-xs text-white/50 mt-1">${r.requestedBy || ''} · Qty ${r.quantity ?? '-'}</p>
      </div>`).join('');
  }
  try {
    const q = query(collection(db, 'material_requests'), where('status', '==', 'pending'));
    onSnapshot(q, snap => {
      window._notifs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderBadge(window._notifs.length); renderList();
    }, () => {});
  } catch (e) { console.warn(e); }

  window.markAllRead = async () => {
    try {
      const snap = await getDocs(query(collection(db,'material_requests'), where('status','==','pending')));
      await Promise.all(snap.docs.map(d => updateDoc(doc(db,'material_requests',d.id), { status: 'read' })));
    } catch(e) {}
  };
</script>

<script>
  // Lucide-like inline SVG helpers
  const I = {
    dashboard: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
    thermo: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4 4 0 1 0 5 0z"/></svg>',
    droplets: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></svg>',
    fan: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 1 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 1-7.002 8.618l1.45-5.412Z"/><circle cx="12" cy="12" r="1.5"/></svg>',
    package: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8 12 13 3 8"/><path d="M3 16V8a2 2 0 0 1 1-1.73l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16Z"/></svg>',
    clipboard: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>',
    check: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    chevron: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="9 18 15 12 9 6"/></svg>',
  };

  const SYSTEMS = [
    { id: 'dashboard',  label: 'Dashboard',          icon: I.dashboard, badge: 'Home',     sub: 'Overview & quick links',                url: null },
    { id: 'hvac-ahu',   label: 'AHU / FAHU',         icon: I.thermo,    badge: 'HVAC',     sub: 'Main Building & Medical Tower units',   url: 'https://hvac-ppm.web.app' },
    { id: 'chillers',   label: 'Chillers',           icon: I.thermo,    badge: 'Chillers', sub: 'York · Daikin · Royal',                 url: 'https://hvac-ppm.web.app' },
    { id: 'chw-pumps',  label: 'CHW Pumps',          icon: I.droplets,  badge: 'Pumps',    sub: 'York · Royal CH.W. Pumps',              url: 'https://hvac-ppm.web.app' },
    { id: 'exhaust-fans', label: 'Exhaust Fans',     icon: I.fan,       badge: 'EX Fans',  sub: 'Zones S.B.1 → Zone 9',                  url: 'https://hvac-ppm.web.app' },
    { id: 'warehouse',  label: 'Warehouse',          icon: I.package,   badge: 'Inventory',sub: 'Store · Stock movements',               url: 'https://hvac-inventory.web.app' },
    { id: 'material-request', label: 'Material Request', icon: I.clipboard, badge: 'Request', sub: 'Issue materials · نموذج صرف مواد', url: 'https://hvac-inventory.web.app' },
    { id: 'engineer-approval', label: 'Engineer Approval', icon: I.check, badge: 'Engineer', sub: 'Approve requests · اعتماد الطلبات', url: 'https://hvac-inventory.web.app' },
  ];

  const TABS = ['dashboard','hvac-ahu','warehouse','material-request'];

  let current = 'dashboard';

  function renderSidebar() {
    document.getElementById('sideNav').innerHTML = SYSTEMS.map(s => {
      const active = s.id === current;
      return `<a href="#" onclick="event.preventDefault();navigate('${s.id}')"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${active
          ? 'bg-cyan-500/20 border border-cyan-400/30 text-cyan-300'
          : 'text-white/60 hover:text-white hover:bg-white/5'}">
        ${s.icon}<span class="flex-1">${s.label}</span>${active ? I.chevron : ''}
      </a>`;
    }).join('');
  }

  function renderTabs() {
    document.getElementById('tabNav').innerHTML = TABS.map(id => {
      const s = SYSTEMS.find(x => x.id === id);
      const active = s.id === current;
      return `<a href="#" onclick="event.preventDefault();navigate('${s.id}')"
        class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 ${active ? 'text-cyan-400' : 'text-white/40'}">
        <div class="p-1.5 rounded-xl ${active ? 'bg-cyan-500/20' : ''}">${s.icon}</div>
        <span class="text-[10px] font-medium">${s.label}</span>
      </a>`;
    }).join('');
  }

  function renderDashboard() {
    const cards = SYSTEMS.filter(s => s.id !== 'dashboard').map(s => `
      <button onclick="openCard('${s.id}')" class="text-left group relative flex flex-col gap-4 p-5 bg-gray-900/60 border border-white/10 rounded-2xl hover:border-cyan-400/40 hover:-translate-y-0.5 transition-all">
        <div class="flex items-start justify-between">
          <div class="h-11 w-11 grid place-items-center rounded-xl bg-cyan-500/10 border border-cyan-400/20 text-cyan-300">${s.icon}</div>
          <span class="text-[10px] font-semibold uppercase tracking-wide px-2 py-1 rounded-full bg-white/5 border border-white/10 text-white/60">${s.badge}</span>
        </div>
        <div class="flex-1">
          <h3 class="text-base font-semibold text-white">${s.label}</h3>
          <p class="mt-1 text-sm text-white/50">${s.sub}</p>
        </div>
        <div class="flex items-center justify-between text-sm text-cyan-300 font-medium">
          <span>Open</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .2s"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </div>
      </button>`).join('');

    return `
      <div class="max-w-6xl mx-auto">
        <div class="mb-6">
          <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight">Select a maintenance system</h2>
          <p class="mt-1 text-sm text-white/50">Choose a category to view assets, schedules, and work orders.</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div>
        <footer class="mt-12 pt-6 border-t border-white/10 text-center text-xs text-white/40">
          CMMS Maintenance System · Al Majal Al Arabi Group · King Faisal Medical Complex
        </footer>
      </div>`;
  }

  function renderSystemPage(s) {
    return `
      <div class="max-w-3xl mx-auto">
        <div class="flex items-center gap-3 mb-5">
          <div class="h-12 w-12 grid place-items-center rounded-xl bg-cyan-500/10 border border-cyan-400/20 text-cyan-300">${s.icon}</div>
          <div>
            <h2 class="text-xl font-semibold">${s.label}</h2>
            <p class="text-sm text-white/50">${s.sub}</p>
          </div>
        </div>
        <div class="bg-gray-900/60 border border-white/10 rounded-2xl p-6">
          <p class="text-white/70 text-sm mb-4">Launch the full ${s.label} module in a focused view.</p>
          <button onclick="openSystem('${s.url}','${s.label.replace(/'/g,"\\'")}')"
            class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-semibold text-sm">
            Open ${s.label}
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      </div>`;
  }

  window.navigate = (id) => {
    current = id;
    const s = SYSTEMS.find(x => x.id === id);
    const page = document.getElementById('page');
    page.classList.remove('route-enter'); void page.offsetWidth; page.classList.add('route-enter');
    page.innerHTML = id === 'dashboard' ? renderDashboard() : renderSystemPage(s);
    // Back button (mobile) visible on non-root
    const backBtn = document.getElementById('backBtn');
    const menuBtn = document.getElementById('menuBtn');
    const isRoot = TABS.includes(id) || id === 'dashboard';
    backBtn.classList.toggle('hidden', isRoot);
    backBtn.classList.toggle('flex', !isRoot);
    menuBtn.classList.toggle('hidden', !isRoot);
    renderSidebar(); renderTabs();
    closeSidebar();
    window.scrollTo(0,0);
  };

  window.openCard = (id) => {
    const s = SYSTEMS.find(x => x.id === id);
    if (s.url) openSystem(s.url, s.label);
    else navigate(id);
  };

  window.openSystem = (url, title) => {
    if (!url) return;
    document.getElementById('systemTitle').textContent = title || '';
    document.getElementById('systemFrame').src = url;
    document.getElementById('systemView').classList.remove('hidden');
  };
  window.closeSystem = () => {
    document.getElementById('systemView').classList.add('hidden');
    document.getElementById('systemFrame').src = 'about:blank';
  };

  window.goBack = () => navigate('dashboard');
  window.openSidebar = () => { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('overlay').classList.remove('hidden'); };
  window.closeSidebar = () => { if (window.innerWidth < 1024) { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('overlay').classList.add('hidden'); } };
  window.toggleNotif = () => document.getElementById('notifPanel').classList.toggle('hidden');
  window.openDelete = () => document.getElementById('deleteDlg').classList.remove('hidden');
  window.closeDelete = () => { document.getElementById('deleteDlg').classList.add('hidden'); document.getElementById('delInput').value=''; document.getElementById('delBtn').disabled=true; };
  window.confirmLogout = () => document.getElementById('logoutDlg').classList.remove('hidden');
  window.doLogout = () => { try { localStorage.removeItem('cmms_user'); localStorage.removeItem('cmms_session'); sessionStorage.removeItem('cmms_user'); sessionStorage.removeItem('cmms_session'); } catch(e){} window.location.replace('login.html'); };

  renderSidebar(); renderTabs(); navigate('dashboard');
</script>

</body>
</html>
