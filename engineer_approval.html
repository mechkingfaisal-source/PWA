<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Engineer Approval — CMMS KFMC</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;min-height:100vh}
:root{--blue:#0a2e5c;--blue2:#1565c0;--green:#2e7d32;--red:#c62828;--orange:#e65100;--border:#b0c4de}
.header{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px #0005}
.header h1{font-size:15px;font-weight:900;flex:1}
.back-btn{background:#fff2;border:none;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}
.user-badge{background:#fff2;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}

/* tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border)}
.tab{padding:11px 18px;cursor:pointer;font-size:13px;font-weight:700;color:#888;border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab .cnt{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:5px}

/* list */
.list-wrap{max-width:900px;margin:0 auto;padding:12px}
.req-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:12px;overflow:hidden;border-left:5px solid var(--orange)}
.req-card.approved{border-color:var(--green)}
.req-card.rejected{border-color:var(--red)}
.req-head{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.req-head:hover{background:#f5f9ff}
.req-number{font-weight:900;font-size:14px;color:var(--blue)}
.req-meta{flex:1;font-size:12px;color:#555}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700}
.badge-pending{background:#fff3e0;color:var(--orange)}
.badge-approved{background:#e8f5e9;color:var(--green)}
.badge-rejected{background:#ffebee;color:var(--red)}
.badge-partial{background:#e3f2fd;color:var(--blue2)}
.badge-issued{background:#f3e5f5;color:#6a1fa8;border:1px solid #6a1fa8}
.badge-urgent{background:#fff3e0;color:var(--orange);border:1px solid var(--orange)}

/* detail panel */
.req-detail{display:none;padding:0 16px 16px;border-top:1px solid #e8eef5}
.req-detail.open{display:block}
.detail-section{margin-top:14px}
.detail-section h4{font-size:12px;color:#888;font-weight:700;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #e8eef5}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.info-row{font-size:13px}
.info-row span{font-weight:700;color:var(--blue)}
.items-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.items-tbl th{background:var(--blue);color:#fff;padding:7px 10px;text-align:left}
.items-tbl td{padding:6px 10px;border-bottom:1px solid #e8eef5}
.items-tbl tr.stock-warn td{background:#fff3e0}
.items-tbl tr.stock-zero td{background:#ffebee}

/* sig preview */
.sig-preview{border:1px solid var(--border);border-radius:8px;max-width:220px;background:#fafcff;padding:4px}
.sig-preview img{width:100%;display:block}
.sig-preview p{font-size:10px;text-align:center;color:#888;padding:3px}

/* approval panel */
.approval-panel{background:#f0f7ff;border-radius:10px;padding:14px;margin-top:14px;border:1.5px solid var(--blue2)}
.approval-panel h4{color:var(--blue);font-weight:900;font-size:14px;margin-bottom:12px}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.form-row label{font-size:12px;font-weight:700;color:#555}
.form-row input,.form-row select,.form-row textarea{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:Arial;outline:none;background:#fff}
.form-row textarea{resize:vertical;min-height:60px}
.decision-btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dec-btn{flex:1;padding:12px;border:2.5px solid transparent;border-radius:10px;cursor:pointer;font-size:14px;font-weight:900;font-family:Arial;transition:.15s;background:#fff}
.dec-btn.approve{border-color:var(--green);color:var(--green)}
.dec-btn.approve.selected{background:var(--green);color:#fff}
.dec-btn.partial{border-color:var(--blue2);color:var(--blue2)}
.dec-btn.partial.selected{background:var(--blue2);color:#fff}
.dec-btn.reject{border-color:var(--red);color:var(--red)}
.dec-btn.reject.selected{background:var(--red);color:#fff}
.sig-wrap{border:2px dashed var(--border);border-radius:10px;background:#fafcff;position:relative}
.sig-wrap canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.sig-wrap .sig-label{font-size:11px;color:#888;padding:6px;font-weight:700;text-align:center}
.sig-clear{position:absolute;top:6px;right:8px;background:var(--red);color:#fff;border:none;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:11px;font-weight:700}
.confirm-btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:900;cursor:pointer;margin-top:10px}
.confirm-btn:disabled{opacity:.5;cursor:not-allowed}

/* approved result */
.approved-result{background:#e8f5e9;border-radius:10px;padding:14px;margin-top:14px;border:1.5px solid #a5d6a7;font-size:13px}
.rejected-result{background:#ffebee;border-radius:10px;padding:14px;margin-top:14px;border:1.5px solid #ef9a9a;font-size:13px}
.print-btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:13px;font-weight:700;margin-top:10px}

/* stat cards */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 12px 4px;max-width:900px;margin:0 auto}
.stat-card{border-radius:14px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.15s;box-shadow:0 3px 12px #0002}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0003}
.stat-card .sc-count{font-size:28px;font-weight:900;line-height:1}
.stat-card .sc-label{font-size:12px;font-weight:700;opacity:.88}
.stat-card.pending{background:linear-gradient(135deg,#b8860b,#d4a017)}
.stat-card.approved{background:linear-gradient(135deg,#1a5c1a,#2e7d32)}
.stat-card.rejected{background:linear-gradient(135deg,#8b1c1c,#c62828)}
.stat-card.issued{background:linear-gradient(135deg,#4a1a7a,#6a1fa8)}
@media(max-width:500px){.stat-cards{grid-template-columns:repeat(2,1fr)}}

/* loading */
.loading{text-align:center;padding:40px;color:#888;font-size:14px}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:999;opacity:0;transition:.3s;pointer-events:none;min-width:240px;text-align:center}
.toast.show{opacity:1}

/* PRINT */
@media print{
  .header,.tabs,.back-btn,.no-print,.approval-panel,.decision-btns,.confirm-btn,.print-btn{display:none!important}
  body{background:#fff}
  .req-detail{display:block!important}
  .print-only{display:block!important}
  .print-header{display:block!important}
  .req-card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
  .list-wrap{padding:0}
}
.print-header{display:none;text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--blue)}
.print-header h2{font-size:18px;color:var(--blue);font-weight:900}
.print-header p{font-size:12px;color:#555;margin-top:4px}
</style>
</head>
<body>

<div class="header no-print">
  <div>
    <div style="font-size:10px;opacity:.7">CMMS KFMC — AL MAJAL AL ARABI GROUP</div>
    <h1>👷‍♂️ Engineer Material Approval — اعتماد المهندس</h1>
  </div>
  <div id="notifBell" style="background:#c62828;color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;display:none;animation:bell .5s infinite alternate;cursor:pointer" onclick="filterRequests('Pending')">
    🔔 <span id="notifCount">0</span> طلب جديد
  </div>
  <span class="user-badge" id="userBadge">—</span>
  <button class="back-btn" onclick="goBack()">← خروج</button>
</div>
<style>
@keyframes bell{from{transform:scale(1)}to{transform:scale(1.05)}}
.approved-result .warehouse-info{background:#e3f2fd;border-radius:8px;padding:10px;margin-top:10px;font-size:12px;color:#1565c0;font-weight:700}
</style>

<div class="tabs no-print">
  <div class="tab active" onclick="filterRequests('All')" id="tab-all">📋 All</div>
  <div class="tab" onclick="filterRequests('Pending')" id="tab-pending">⏳ Pending <span class="cnt" id="cntPending">0</span></div>
  <div class="tab" onclick="filterRequests('Approved')" id="tab-approved">✅ Approved <span class="cnt" style="background:var(--green)" id="cntApproved">0</span></div>
  <div class="tab" onclick="filterRequests('Rejected')" id="tab-rejected">❌ Rejected <span class="cnt" style="background:#555" id="cntRejected">0</span></div>
  <div class="tab" onclick="filterRequests('Issued')" id="tab-issued">📦 Issued <span class="cnt" style="background:#6a1fa8" id="cntIssued">0</span></div>
</div>

<div class="stat-cards no-print">
  <div class="stat-card pending" onclick="filterRequests('Pending')">
    <div class="sc-count" id="sc-pending">0</div>
    <div class="sc-label">⏳ Pending</div>
  </div>
  <div class="stat-card approved" onclick="filterRequests('Approved')">
    <div class="sc-count" id="sc-approved">0</div>
    <div class="sc-label">✅ Approved</div>
  </div>
  <div class="stat-card rejected" onclick="filterRequests('Rejected')">
    <div class="sc-count" id="sc-rejected">0</div>
    <div class="sc-label">⊘ Rejected</div>
  </div>
  <div class="stat-card issued" onclick="filterRequests('Issued')">
    <div class="sc-count" id="sc-issued">0</div>
    <div class="sc-label">⊙ Issued</div>
  </div>
</div>

<div class="list-wrap" id="listWrap">
  <div class="loading">⏳ Loading requests...</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════ FIREBASE ═══════════════
const firebaseConfig={
  apiKey:"AIzaSyDr9meYf-fKn7i-3NeQxfSnXNTs-4HGJyE",
  authDomain:"hvac-ppm.firebaseapp.com",
  projectId:"hvac-ppm",
  storageBucket:"hvac-ppm.firebasestorage.app",
  messagingSenderId:"429823910983",
  appId:"1:429823910983:web:1836576203d10cbc9c3d62"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COL = 'material_requests';

// ═══════════════ STATE ═══════════════
var loggedUser = null;
var allRequests = [];
var currentFilter = 'All';
var sigPads = {};
var selectedDecision = {};

function getUser(){
  var raw=sessionStorage.getItem('cmms_user')||localStorage.getItem('cmms_user');
  if(!raw)return null;
  try{return JSON.parse(raw);}catch(e){return null;}
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='CMMS_USER'){
    try{var u=JSON.parse(e.data.data);if(u&&u.name){sessionStorage.setItem('cmms_user',e.data.data);init();}}catch(err){}
  }
});

// ═══════════════ INIT ═══════════════
function init(){
  loggedUser=getUser();
  if(loggedUser&&loggedUser.name){
    document.getElementById('userBadge').textContent=(loggedUser.role==='engineer'?'👷‍♂️ Eng. ':'👷 ')+loggedUser.name;
  }
  listenRequests();
}

// ═══════════════ REALTIME LISTENER ═══════════════
function listenRequests(){
  db.collection(COL).orderBy('createdAt','desc').onSnapshot(function(snap){
    allRequests=[];
    snap.forEach(function(doc){
      allRequests.push(Object.assign({_id:doc.id},doc.data()));
    });
    updateCounts();
    renderList();
  },function(err){
    document.getElementById('listWrap').innerHTML='<div class="loading">❌ Error loading: '+err.message+'</div>';
  });
}
function updateCounts(){
  var p=allRequests.filter(function(r){return r.status==='Pending';}).length;
  var a=allRequests.filter(function(r){return r.status==='Approved';}).length;
  var rj=allRequests.filter(function(r){return r.status==='Rejected';}).length;
  var is=allRequests.filter(function(r){return r.status==='Issued';}).length;
  document.getElementById('cntPending').textContent=p;
  document.getElementById('cntApproved').textContent=a;
  document.getElementById('cntRejected').textContent=rj;
  document.getElementById('cntIssued').textContent=is;
  document.getElementById('sc-pending').textContent=p;
  document.getElementById('sc-approved').textContent=a;
  document.getElementById('sc-rejected').textContent=rj;
  document.getElementById('sc-issued').textContent=is;
  // notification bell
  var bell=document.getElementById('notifBell');
  if(bell){bell.style.display=p>0?'inline-block':'none';document.getElementById('notifCount').textContent=p;}
}

// ═══════════════ FILTER ═══════════════
function filterRequests(f){
  currentFilter=f;
  ['Pending','Approved','Rejected','All','Issued'].forEach(function(t){
    var el=document.getElementById('tab-'+t.toLowerCase());
    if(el) el.classList.toggle('active',t===f);
  });
  renderList();
}

// ═══════════════ RENDER LIST ═══════════════
function renderList(){
  var filtered = currentFilter==='All' ? allRequests :
    allRequests.filter(function(r){return r.status===currentFilter;});
  var wrap=document.getElementById('listWrap');
  if(!filtered.length){
    wrap.innerHTML='<div class="loading">No '+currentFilter+' requests found.</div>';
    return;
  }
  wrap.innerHTML='';
  filtered.forEach(function(req){
    wrap.appendChild(buildCard(req));
  });
  // Re-init sig pads for any open panels
  Object.keys(sigPads).forEach(function(k){delete sigPads[k];});
}

function buildCard(req){
  var card=document.createElement('div');
  card.className='req-card'+(req.status==='Approved'?' approved':req.status==='Rejected'?' rejected':'');
  card.id='card-'+req._id;

  var dateStr='';
  if(req.date){try{dateStr=new Date(req.date).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){dateStr=req.date;}}

  var statusBadge='<span class="badge badge-pending">⏳ Pending</span>';
  if(req.status==='Approved') statusBadge='<span class="badge badge-approved">✅ Approved</span>';
  if(req.status==='Rejected') statusBadge='<span class="badge badge-rejected">❌ Rejected</span>';
  if(req.status==='Partial') statusBadge='<span class="badge badge-partial">⚠️ Partial</span>';
  if(req.status==='Issued') statusBadge='<span class="badge badge-issued">📦 Issued</span>';

  var prioBadge='';
  if(req.priority==='Urgent') prioBadge='<span class="badge badge-urgent">🟠 Urgent</span>';
  if(req.priority==='Critical') prioBadge='<span class="badge badge-critical">🔴 Critical</span>';

  card.innerHTML=
    '<div class="req-head" onclick="toggleDetail(\''+req._id+'\')">'+
      '<div>'+
        '<div class="req-number">'+req.reqNo+'</div>'+
        '<div class="req-meta">'+dateStr+' | '+req.techName+' | '+req.building+'</div>'+
      '</div>'+
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
        prioBadge+statusBadge+
        '<span style="font-size:18px;transition:.2s" id="arr-'+req._id+'">▼</span>'+
      '</div>'+
    '</div>'+
    '<div class="req-detail" id="det-'+req._id+'">'+
      buildDetail(req)+
    '</div>';
  return card;
}

function buildDetail(req){
  var itemsHtml='<table class="items-tbl"><thead><tr><th>#</th><th>Material</th><th>Qty</th><th>Unit</th><th>In Stock</th></tr></thead><tbody>';
  if(req.items&&req.items.length){
    req.items.forEach(function(it,i){
      var cls=it.inStock<=0?'stock-zero':it.inStock<=3?'stock-warn':'';
      itemsHtml+='<tr class="'+cls+'"><td>'+(i+1)+'</td><td>'+it.matName+'</td><td><b>'+it.qty+'</b></td><td>'+it.unit+'</td><td style="font-weight:700;color:'+(it.inStock<=0?'#c62828':it.inStock<=3?'#e65100':'#2e7d32')+'">'+it.inStock+'</td></tr>';
    });
  }
  itemsHtml+='</tbody></table>';

  var techSigHtml='';
  if(req.techSig&&req.techSig.length>100){
    techSigHtml='<div class="sig-preview"><img src="'+req.techSig+'"><p>Technician: '+req.techName+'</p></div>';
  }

  var engResultHtml='';
  if(req.status==='Approved'){
    var eDate='';
    if(req.engDate){try{eDate=new Date(req.engDate).toLocaleString('en-GB');}catch(e){eDate=req.engDate;}}
    var engSigHtml='';
    if(req.engSig&&req.engSig.length>100) engSigHtml='<div class="sig-preview" style="margin-top:8px"><img src="'+req.engSig+'"><p>Engineer: '+req.engName+'</p></div>';
    engResultHtml='<div class="approved-result">'+
      '<b style="color:var(--green)">✅ APPROVED</b> by '+req.engName+' — '+eDate+'<br>'+
      (req.engNotes?'<i>Notes: '+req.engNotes+'</i>':'')+
      engSigHtml+
      '<button class="print-btn no-print" onclick="printRequest(\''+req._id+'\')">🖨️ Print</button>'+
    '</div>';
  } else if(req.status==='Rejected'){
    engResultHtml='<div class="rejected-result">'+
      '<b style="color:var(--red)">❌ REJECTED</b> by '+req.engName+'<br>'+
      '<i>Reason: '+(req.engNotes||'—')+'</i>'+
    '</div>';
  } else {
    // Show approval panel for engineer
    engResultHtml=buildApprovalPanel(req);
  }

  return '<div class="print-header">'+
    '<h2>KING FAISAL MEDICAL COMPLEX — KFMC</h2>'+
    '<p>AL MAJAL AL ARABI GROUP — Mechanical Maintenance</p>'+
    '<h3 style="margin-top:6px;font-size:15px">MATERIAL REQUEST FORM</h3>'+
  '</div>'+
  '<div class="detail-section"><h4>Request Info</h4>'+
  '<div class="info-grid">'+
    '<div class="info-row">Request No: <span>'+req.reqNo+'</span></div>'+
    '<div class="info-row">Date: <span>'+(req.date?new Date(req.date).toLocaleDateString('en-GB'):'—')+'</span></div>'+
    '<div class="info-row">Technician: <span>'+req.techName+'</span></div>'+
    '<div class="info-row">ID / Iqama: <span>'+(req.techId||'—')+'</span></div>'+
    '<div class="info-row">Building: <span>'+req.building+'</span></div>'+
    '<div class="info-row">Priority: <span>'+req.priority+'</span></div>'+
    '<div class="info-row" style="grid-column:span 2">Work Order: <span>'+req.workOrder+'</span></div>'+
    '<div class="info-row" style="grid-column:span 2">Reason: <span>'+(req.reason||'—')+'</span></div>'+
  '</div></div>'+
  '<div class="detail-section"><h4>Requested Materials</h4>'+itemsHtml+'</div>'+
  '<div class="detail-section"><h4>Technician Signature</h4>'+techSigHtml+'</div>'+
  '<div class="detail-section"><h4>Engineer Decision</h4>'+engResultHtml+'</div>';
}

function buildApprovalPanel(req){
  return '<div class="approval-panel" id="apanel-'+req._id+'">'+
    '<h4>👷‍♂️ Engineer Decision — قرار المهندس</h4>'+
    '<div class="decision-btns">'+
      '<button class="dec-btn approve" onclick="selectDecision(\''+req._id+'\',\'Approved\',this)">✅ Approve اعتماد</button>'+
      '<button class="dec-btn partial" onclick="selectDecision(\''+req._id+'\',\'Partial\',this)">⚠️ Partial جزئي</button>'+
      '<button class="dec-btn reject" onclick="selectDecision(\''+req._id+'\',\'Rejected\',this)">❌ Reject رفض</button>'+
    '</div>'+
    '<div class="form-row">'+
      '<label>Engineer Notes / Rejection Reason ملاحظات المهندس</label>'+
      '<textarea id="engNotes-'+req._id+'" rows="2" placeholder="Notes or reason for rejection..."></textarea>'+
    '</div>'+
    '<div class="form-row">'+
      '<label>Engineer Signature توقيع المهندس</label>'+
      '<div class="sig-wrap" id="engSigWrap-'+req._id+'">'+
        '<div class="sig-label">Sign here</div>'+
        '<canvas id="engSig-'+req._id+'" height="110"></canvas>'+
        '<button class="sig-clear" onclick="clearEngSig(\''+req._id+'\')">Clear</button>'+
      '</div>'+
    '</div>'+
    '<button class="confirm-btn no-print" id="confirmBtn-'+req._id+'" onclick="confirmDecision(\''+req._id+'\')" disabled>'+
      '⏳ Select a decision first'+
    '</button>'+
  '</div>';
}

// ═══════════════ TOGGLE DETAIL ═══════════════
function toggleDetail(id){
  var det=document.getElementById('det-'+id);
  var arr=document.getElementById('arr-'+id);
  var isOpen=det.classList.contains('open');
  det.classList.toggle('open',!isOpen);
  if(arr) arr.style.transform=isOpen?'':'rotate(180deg)';
  if(!isOpen){
    // init eng sig pad
    setTimeout(function(){
      var canvas=document.getElementById('engSig-'+id);
      if(canvas&&!sigPads['eng-'+id]) initEngSig(id);
    },50);
  }
}

// ═══════════════ SIG PADS ═══════════════
function initEngSig(id){
  var canvas=document.getElementById('engSig-'+id);
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var wrap=canvas.parentElement;
  function resize(){canvas.width=wrap.offsetWidth;ctx.strokeStyle='#0a2e5c';ctx.lineWidth=2.5;ctx.lineCap='round';}
  resize();
  window.addEventListener('resize',resize);
  var drawing=false,lx=0,ly=0;
  function pos(e){var r=canvas.getBoundingClientRect();var sc=canvas.width/r.width;var src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*sc,y:(src.clientY-r.top)*sc};}
  canvas.addEventListener('mousedown',function(e){drawing=true;var p=pos(e);lx=p.x;ly=p.y;});
  canvas.addEventListener('mousemove',function(e){if(!drawing)return;var p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;});
  canvas.addEventListener('mouseup',function(){drawing=false;});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();drawing=true;var p=pos(e);lx=p.x;ly=p.y;},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();if(!drawing)return;var p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;},{passive:false});
  canvas.addEventListener('touchend',function(){drawing=false;});
  sigPads['eng-'+id]=canvas;
}
function clearEngSig(id){
  var c=sigPads['eng-'+id];
  if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);
}
function isSigEmpty(canvas){
  if(!canvas)return true;
  var d=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
  for(var i=3;i<d.length;i+=4){if(d[i]>10)return false;}
  return true;
}

// ═══════════════ DECISION ═══════════════
function selectDecision(id,decision,btn){
  selectedDecision[id]=decision;
  var panel=document.getElementById('apanel-'+id);
  if(!panel)return;
  panel.querySelectorAll('.dec-btn').forEach(function(b){b.classList.remove('selected');});
  btn.classList.add('selected');
  var confirmBtn=document.getElementById('confirmBtn-'+id);
  if(confirmBtn){
    confirmBtn.disabled=false;
    var labels={Approved:'✅ Confirm Approval — اعتماد',Partial:'⚠️ Confirm Partial — جزئي',Rejected:'❌ Confirm Rejection — رفض'};
    confirmBtn.textContent=labels[decision]||'Confirm';
    confirmBtn.style.background=decision==='Approved'?'var(--green)':decision==='Rejected'?'var(--red)':'var(--blue2)';
  }
}

function confirmDecision(id){
  var decision=selectedDecision[id];
  if(!decision){showToast('⚠️ Select a decision first');return;}
  var notes=document.getElementById('engNotes-'+id);
  var notesVal=notes?notes.value.trim():'';
  if(decision==='Rejected'&&!notesVal){showToast('⚠️ Rejection reason is required');return;}
  var canvas=sigPads['eng-'+id];
  if(isSigEmpty(canvas)){showToast('⚠️ Engineer signature required');return;}
  var engName=loggedUser&&loggedUser.name?loggedUser.name:'Engineer';
  var engSigData=canvas.toDataURL('image/png');
  var confirmBtn=document.getElementById('confirmBtn-'+id);
  if(confirmBtn){confirmBtn.disabled=true;confirmBtn.textContent='⏳ Saving...';}

  var req=allRequests.find(function(r){return r._id===id;});
  var updates={
    status:decision,
    engName:engName,
    engDecision:decision,
    engNotes:notesVal,
    engSig:engSigData,
    engDate:new Date().toISOString()
  };

  // If approved or partial: deduct from warehouse localStorage
  if((decision==='Approved'||decision==='Partial')&&req&&req.items){
    deductWarehouse(req.items);
  }

  db.collection(COL).doc(id).update(updates)
    .then(function(){
      var msg = decision==='Approved'?'✅ تم الاعتماد — الطلب أُرسل للمستودع':
                decision==='Rejected'?'❌ رُفض الطلب':
                '⚠️ اعتماد جزئي — الطلب أُرسل للمستودع';
      showToast(msg);
      // Re-render the card to show approved state
      var card = document.getElementById('det-'+id);
      if(card) card.querySelector('.approval-panel') && card.querySelector('.approval-panel').remove && null;
    })
    .catch(function(err){
      showToast('❌ Error: '+err.message);
      if(confirmBtn){confirmBtn.disabled=false;confirmBtn.textContent='Retry';}
    });
}

function deductWarehouse(items){
  try{
    var raw=localStorage.getItem('wh_items');
    if(!raw)return;
    var wh=JSON.parse(raw);
    items.forEach(function(it){
      var found=wh.find(function(w){return w.id===it.matId;});
      if(found){
        found.nett=Math.max(0,found.nett-it.qty);
      }
    });
    localStorage.setItem('wh_items',JSON.stringify(wh));
    // Also save transaction
    var txRaw=localStorage.getItem('wh_tx');
    var tx=txRaw?JSON.parse(txRaw):[];
    items.forEach(function(it){
      tx.push({type:'out',itemId:it.matId,itemName:it.matName,qty:it.qty,unit:it.unit,tech:loggedUser&&loggedUser.name?loggedUser.name:'Approved',note:'Approved request',ts:Date.now()});
    });
    localStorage.setItem('wh_tx',JSON.stringify(tx));
  }catch(e){}
}

// ═══════════════ BUILD APPROVED RESULT ═══════════════
function buildApprovedResult(req){
  var decision = req.status;
  var label = decision==='Approved'?'✅ اعتمد المهندس':decision==='Partial'?'⚠️ اعتماد جزئي':'❌ رُفض';
  var cls = decision==='Approved'||decision==='Partial'?'approved-result':'rejected-result';
  var html = '<div class="'+cls+'">';
  html += '<b>'+label+'</b><br>';
  html += '<small style="color:#555">المهندس: '+req.engName+' · '+new Date(req.engDate).toLocaleString('ar-SA')+'</small>';
  if(req.engNotes) html += '<br><small>ملاحظات: '+req.engNotes+'</small>';
  if(decision==='Approved'||decision==='Partial'){
    html += '<div class="warehouse-info">🏭 الطلب أُرسل تلقائياً للمستودع — يمكن لمسؤول المستودع الآن صرف القطع</div>';
  }
  html += '<button class="print-btn no-print" onclick="printRequest(''+req._id+'')">🖨️ طباعة</button>';
  html += '</div>';
  return html;
}

// ═══════════════ PRINT ═══════════════
function printRequest(id){
  // Close all other details
  allRequests.forEach(function(r){
    if(r._id!==id){
      var d=document.getElementById('det-'+r._id);
      if(d)d.classList.remove('open');
    }
  });
  var det=document.getElementById('det-'+id);
  if(det)det.classList.add('open');
  setTimeout(function(){window.print();},200);
}

// ═══════════════ TOAST ═══════════════
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3500);
}

function goBack(){
  if(window.parent&&window.parent!==window) window.parent.postMessage({type:'BACK'},'*');
  else window.location.href='index.html';
}

// ═══════════════ START ═══════════════
init();
</script>
