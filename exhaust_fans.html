<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CMMS — King Faisal Medical Complex</title>
<link rel="manifest" href="/PWA/manifest.json">
<meta name="theme-color" content="#0a2e5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']}}}}</script>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#030712;color:#fff;font-family:'Inter',sans-serif;transition:background .3s,color .3s}

/* ── Light mode overrides ── */
body.light-mode{background:#f0f4f8;color:#0f172a}
body.light-mode #sidebar{background:#fff;border-color:#e2e8f0}
body.light-mode #sidebar nav a{color:#475569}
body.light-mode #sidebar nav a:hover{background:#f1f5f9;color:#0f172a}
body.light-mode #sidebar nav a.bg-cyan-500\/20{background:rgba(26,95,174,.12);color:#1a5fae;border-color:rgba(26,95,174,.35)}
body.light-mode #sidebar .border-t,body.light-mode #sidebar .border-b{border-color:#e2e8f0}
body.light-mode header{background:rgba(255,255,255,.92);border-color:#e2e8f0}
body.light-mode header .text-white\/50{color:#64748b}
body.light-mode #notifPanel{background:#fff;border-color:#e2e8f0}
body.light-mode #notifPanel .divide-white\/5>*{border-color:#f1f5f9}
body.light-mode #notifPanel .hover\:bg-white\/5:hover{background:#f8fafc}
body.light-mode #notifPanel .text-white\/40{color:#94a3b8}
body.light-mode #tabNav{background:rgba(255,255,255,.95);border-color:#e2e8f0}
body.light-mode #tabNav a{color:#94a3b8}
body.light-mode #tabNav a.text-cyan-400{color:#1a5fae}
body.light-mode main{background:#f0f4f8}
body.light-mode .sys-card{border-color:#cbd5e1}
body.light-mode .sys-card:hover{border-color:rgba(26,95,174,.5)}
body.light-mode #logoutDlg>div{background:#fff;border-color:#e2e8f0}
body.light-mode #systemView{background:#f0f4f8}
body.light-mode #systemView .bg-gray-900{background:#fff;border-color:#e2e8f0}
body.light-mode .bg-gray-900\/60{background:rgba(255,255,255,.8)}
body.light-mode .border-white\/10{border-color:#e2e8f0}
body.light-mode .text-white\/70{color:#334155}
body.light-mode .text-white\/60{color:#475569}
body.light-mode .text-white\/50{color:#64748b}
body.light-mode h2,body.light-mode h3{color:#0f172a}
body.light-mode footer{color:#94a3b8;border-color:#e2e8f0}
.icon{width:18px;height:18px;stroke-width:2}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.route-enter{animation:slideIn .18s ease both}
@keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.card-enter{animation:fadeUp .25s ease both}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.safe-top{padding-top:env(safe-area-inset-top)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
/* Card hover glow */
.sys-card:hover .card-glow{opacity:1}
.card-glow{opacity:0;transition:opacity .3s;position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 1.5px rgba(0,180,216,.5),0 8px 32px rgba(0,180,216,.15);pointer-events:none}

/* ── Mobile-app-style home icons ── */
.app-icon{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.app-icon-tile{position:relative;width:100%;aspect-ratio:1/1;border-radius:24%;overflow:hidden;background:#0b1220;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 10px 18px -6px rgba(0,0,0,.65),0 2px 4px rgba(0,0,0,.45);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;transform:translateZ(0)}
.app-icon:hover .app-icon-tile{transform:translateY(-4px) scale(1.06);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 18px 28px -8px rgba(0,0,0,.7),0 0 0 1.5px rgba(0,180,216,.45),0 0 18px rgba(0,180,216,.25)}
.app-icon:active .app-icon-tile{transform:scale(.9);transition-duration:.08s;box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 4px 8px rgba(0,0,0,.5)}
.app-icon-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.app-icon-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1a5fae,#0a1628)}
.app-icon-fallback .icon{width:46%;height:46%;color:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.app-icon-gloss{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.08) 32%,rgba(255,255,255,0) 55%);pointer-events:none}
.app-icon-rim{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.app-icon-badge{position:absolute;left:0;right:0;bottom:0;width:100%;font-size:8.5px;line-height:1.25;font-weight:800;letter-spacing:.01em;text-transform:uppercase;padding:3px 3px 4px;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 65%,transparent 100%);color:#fff;white-space:normal;word-break:normal;overflow:visible;text-shadow:0 1px 2px rgba(0,0,0,.5)}
@media (max-width:480px){.app-icon-badge{font-size:7.5px;padding:2.5px 2px 3.5px}}
body.light-mode .app-icon-badge{background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.4) 65%,transparent 100%);color:#fff}
.app-icon-label{font-size:11px;font-weight:600;text-align:center;color:rgba(255,255,255,.88);line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.55)}
body.light-mode .app-icon-label{color:#1e293b;text-shadow:none}

/* ── Focus accessibility ── */
.app-icon:focus-visible .app-icon-tile,
button:focus-visible,
a:focus-visible{outline:2px solid #00b4d8;outline-offset:2px}

/* ── Splash screen ── */
#splash{position:fixed;inset:0;z-index:999;background:#030712;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s ease,visibility .4s ease}
#splash.fade-out{opacity:0;visibility:hidden;pointer-events:none}
#splash .splash-logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(160deg,#00b4d8,#0a2e5c);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 10px 30px rgba(0,180,216,.35);animation:splashPulse 1.6s ease-in-out infinite}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#splash .splash-title{color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;text-align:center}
#splash .splash-sub{color:rgba(255,255,255,.45);font-size:12px;text-align:center}
#splash .splash-spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#00b4d8;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.light-mode #splash{background:#f0f4f8}
body.light-mode #splash .splash-sub{color:#64748b}
body.light-mode #splash .splash-title{color:#0f172a}

/* ── Skeleton loaders ── */
.skel{position:relative;overflow:hidden;background:rgba(255,255,255,.06);border-radius:10px}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);animation:skelShine 1.4s infinite}
@keyframes skelShine{100%{transform:translateX(100%)}}
body.light-mode .skel{background:rgba(15,23,42,.06)}
body.light-mode .skel::after{background:linear-gradient(90deg,transparent,rgba(15,23,42,.08),transparent)}

/* ── Toast notifications ── */
#toastHost{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:toastIn .25s ease both;white-space:nowrap}
.toast.success{background:#0a2e5c;border:1px solid rgba(0,180,216,.4)}
.toast.error{background:#b91c1c;border:1px solid rgba(248,113,113,.4)}
.toast.info{background:#1e293b;border:1px solid rgba(255,255,255,.15)}
.toast.out{animation:toastOut .25s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.95)}}

/* ── Connection status dot ── */
#connDot{width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18);transition:background .25s,box-shadow .25s}
#connDot.online{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
#connDot.offline{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.18)}

/* ── Version badge ── */
.version-tag{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.04em}
body.light-mode .version-tag{color:#94a3b8}

/* ── Breadcrumb ── */
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.4);margin-bottom:10px}
.crumb button{color:rgba(255,255,255,.4);background:none;border:none;padding:0;cursor:pointer;font-size:12px}
.crumb button:hover{color:#00b4d8}
.crumb .crumb-sep{opacity:.4}
.crumb .crumb-current{color:#00b4d8;font-weight:600}
body.light-mode .crumb,body.light-mode .crumb button{color:#64748b}
body.light-mode .crumb .crumb-current{color:#1a5fae}
/* ── Navy/accent palette override — aligns Tailwind cyan utilities
     with the navy design system used across all PPM screens ── */
.from-cyan-500.to-blue-600{background-image:linear-gradient(to bottom right,#0a2e5c,#1a5fae)}
.bg-cyan-500{background-color:#00b4d8}
.bg-cyan-500\/10{background-color:rgba(0,180,216,.10)}
.bg-cyan-500\/20{background-color:rgba(0,180,216,.20)}
.border-cyan-400\/20{border-color:rgba(0,180,216,.20)}
.border-cyan-400\/30{border-color:rgba(0,180,216,.30)}
.text-cyan-300,.text-cyan-400{color:#7dd3fc}
.text-cyan-400\/70{color:rgba(125,211,252,.7)}
.hover\:bg-cyan-400:hover{background-color:#00b4d8}
.hover\:text-cyan-300:hover{color:#7dd3fc}
</style>
</head>
<body>

<!-- Splash screen -->
<div id="splash">
  <div class="splash-logo">⚙️</div>
  <div>
    <p class="splash-title">CMMS — King Faisal Medical Complex</p>
    <p class="splash-sub">AL MAJAL AL ARABI GROUP</p>
  </div>
  <div class="splash-spinner"></div>
</div>

<!-- Toast host -->
<div id="toastHost"></div>

<div id="app" class="min-h-screen flex safe-top">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 border-r border-white/10 flex flex-col transform -translate-x-full transition-transform duration-300 lg:translate-x-0 lg:static lg:flex safe-top">
    <div class="p-5 border-b border-white/10 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-lg">⚙️</div>
      <div>
        <p class="font-bold text-white text-sm leading-tight">CMMS System</p>
        <p class="text-cyan-400/70 text-xs">King Faisal Medical</p>
      </div>
    </div>
    <div class="p-4 border-b border-white/10">
      <div class="flex items-center gap-2 px-3 py-2 rounded-xl border bg-cyan-500/20 text-cyan-300 border-cyan-400/30">
        <span>🔧</span>
        <div class="min-w-0">
          <p id="sidebarUserName" class="text-xs font-semibold truncate">Maintenance Team</p>
          <p id="sidebarUserRole" class="text-xs opacity-70">technician</p>
        </div>
      </div>
    </div>
    <nav id="sideNav" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
    <div class="p-3 border-t border-white/10 space-y-1">
      <button onclick="confirmLogout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-red-400 hover:bg-red-500/10 transition-all">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Logout</span>
      </button>
      <div class="flex items-center justify-center pt-2">
        <span class="version-tag">CMMS v2.5.0</span>
      </div>
    </div>
  </aside>

  <div id="overlay" class="fixed inset-0 z-40 bg-black/50 hidden lg:hidden" onclick="closeSidebar()"></div>

  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top bar -->
    <header class="bg-gray-900/90 backdrop-blur-sm border-b border-white/10 flex items-center px-3 gap-2 sticky top-0 z-30 min-h-14 safe-top">
      <button id="backBtn" onclick="goBack()" class="hidden items-center gap-1 p-2 rounded-lg hover:bg-white/10 text-cyan-300">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span class="text-sm font-medium">Back</span>
      </button>
      <button id="menuBtn" onclick="openSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-white/10">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="flex-1 text-sm text-white/50 hidden sm:block truncate">King Faisal Medical Complex — AL MAJAL AL ARABI GROUP</div>
      <!-- Connection status -->
      <div class="flex items-center gap-1.5 px-2" title="Connection status">
        <span id="connDot"></span>
        <span id="connLabel" class="text-[11px] text-white/40 hidden sm:inline">Connecting…</span>
      </div>
      <!-- Theme toggle -->
      <button id="themeBtn" onclick="toggleTheme()" title="Toggle light/dark mode" class="relative p-2 rounded-lg hover:bg-white/10 transition-colors">
        <svg id="iconSun" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="iconMoon" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button onclick="toggleNotif()" class="relative p-2 rounded-lg hover:bg-white/10">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span id="notifDot" class="hidden absolute top-1 right-1 min-w-[16px] h-4 px-1 text-[10px] font-bold bg-red-500 text-white rounded-full grid place-items-center"></span>
      </button>
    </header>

    <!-- Notification panel -->
    <div id="notifPanel" class="hidden absolute right-3 top-14 mt-1 w-80 max-w-[95vw] bg-gray-900 border border-white/10 rounded-2xl shadow-2xl z-40 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
        <p class="font-semibold text-sm">Pending Material Requests</p>
        <button onclick="markAllRead()" class="text-xs text-cyan-400 hover:text-cyan-300">Mark all read</button>
      </div>
      <div id="notifList" class="max-h-80 overflow-y-auto divide-y divide-white/5 text-sm">
        <div class="p-3 space-y-2">
          <div class="skel h-3 w-3/4"></div>
          <div class="skel h-3 w-1/2"></div>
        </div>
        <div class="p-3 space-y-2">
          <div class="skel h-3 w-2/3"></div>
          <div class="skel h-3 w-1/3"></div>
        </div>
      </div>
    </div>

    <main id="page" class="flex-1 overflow-auto p-4 lg:p-6 route-enter" style="padding-bottom:calc(5rem + env(safe-area-inset-bottom))"></main>
  </div>

  <!-- Bottom tab nav -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-gray-900/95 backdrop-blur-lg border-t border-white/10 flex safe-bottom" id="tabNav"></nav>
</div>

<!-- Logout dialog -->
<div id="logoutDlg" class="hidden fixed inset-0 z-[300] flex items-center justify-center bg-black/70 p-4">
  <div class="bg-gray-900 border border-white/10 rounded-2xl w-full max-w-sm p-6">
    <h3 class="font-bold text-white mb-2">Logout</h3>
    <p class="text-white/60 text-sm mb-5">Are you sure you want to log out?</p>
    <div class="flex gap-3">
      <button onclick="document.getElementById('logoutDlg').classList.add('hidden')" class="flex-1 py-2.5 rounded-xl border border-white/20 text-white/60 hover:text-white text-sm">Cancel</button>
      <button onclick="doLogout()" class="flex-1 py-2.5 rounded-xl bg-red-500/80 hover:bg-red-500 text-white font-bold text-sm">Logout</button>
    </div>
  </div>
</div>

<!-- System iframe -->
<div id="systemView" class="hidden fixed inset-0 z-[150] bg-gray-950 flex flex-col">
  <div class="min-h-14 flex items-center px-3 border-b border-white/10 bg-gray-900 safe-top">
    <button onclick="closeSystem()" class="flex items-center gap-1 p-2 rounded-lg hover:bg-white/10 text-cyan-300">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span class="text-sm font-medium">Back to Dashboard</span>
    </button>
    <div class="flex-1 text-center text-sm text-white/60" id="systemTitle"></div>
    <div class="w-24"></div>
  </div>
  <iframe id="systemFrame" class="flex-1 w-full bg-white" src="about:blank"></iframe>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDr9meYf-fKn7i-3NeQxfSnXNTs-4HGJyE",
    authDomain: "hvac-ppm.firebaseapp.com", projectId: "hvac-ppm",
    storageBucket: "hvac-ppm.appspot.com", messagingSenderId: "000000000000",
    appId: "1:000000000000:web:0000000000000000000000"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._notifs = [];

  // ── Connection status ──────────────────────────────
  function setConn(state){
    const dot=document.getElementById('connDot');
    const label=document.getElementById('connLabel');
    if(!dot) return;
    dot.classList.remove('online','offline');
    if(state==='online'){dot.classList.add('online');if(label)label.textContent='Online';}
    else if(state==='offline'){dot.classList.add('offline');if(label)label.textContent='Offline';}
    else{if(label)label.textContent='Connecting…';}
  }
  window.addEventListener('online',()=>setConn('online'));
  window.addEventListener('offline',()=>setConn('offline'));
  setConn(navigator.onLine===false?'offline':'connecting');

  function renderBadge(n){const d=document.getElementById('notifDot');if(n>0){d.textContent=n>99?'99+':n;d.classList.remove('hidden')}else d.classList.add('hidden')}
  function renderList(){const el=document.getElementById('notifList');if(!window._notifs.length){el.innerHTML='<div class="p-6 text-center text-white/40 text-sm">No pending requests</div>';return}el.innerHTML=window._notifs.map(r=>`<div class="p-3 hover:bg-white/5"><div class="flex justify-between gap-2"><p class="font-medium text-white truncate">${r.material||r.title||'Material Request'}</p><span class="text-[10px] text-yellow-300 bg-yellow-500/10 border border-yellow-400/30 rounded px-1.5 py-0.5">Pending</span></div><p class="text-xs text-white/50 mt-1">${r.requestedBy||''} · Qty ${r.quantity??'-'}</p></div>`).join('')}
  try{
    const q=query(collection(db,'material_requests'),where('status','==','pending'));
    onSnapshot(q,
      snap=>{window._notifs=snap.docs.map(d=>({id:d.id,...d.data()}));renderBadge(window._notifs.length);renderList();setConn('online');},
      ()=>{setConn('offline');}
    );
  }catch(e){console.warn(e);setConn('offline');}

  window.markAllRead=async()=>{
    const btn = document.activeElement && document.activeElement.tagName==='BUTTON' ? document.activeElement : null;
    const prevText = btn ? btn.textContent : null;
    if(btn){btn.disabled=true;btn.textContent='Updating…';}
    try{
      const snap=await getDocs(query(collection(db,'material_requests'),where('status','==','pending')));
      await Promise.all(snap.docs.map(d=>updateDoc(doc(db,'material_requests',d.id),{status:'read'})));
      window.showToast && window.showToast('All requests marked as read','success');
    }catch(e){
      window.showToast && window.showToast('Failed to update requests','error');
    }finally{
      if(btn){btn.disabled=false;btn.textContent=prevText||'Mark all read';}
    }
  };
</script>

<script>
  // ── Session guard: must be logged in to view this page ─────────
  const CURRENT_USER = (function(){
    var raw = sessionStorage.getItem('cmms_user') || localStorage.getItem('cmms_user');
    if(!raw) raw = sessionStorage.getItem('cmms_session') || localStorage.getItem('cmms_session');
    if(!raw) return null;
    try{
      var u = JSON.parse(raw);
      if(!u || !u.role) return null;
      return u;
    }catch(e){ return null; }
  })();
  if(!CURRENT_USER){
    window.location.replace('login.html');
    throw new Error('CMMS: no active session — redirecting to login.');
  }

  const I = {
    dashboard:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
    building:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>',
    tower:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18M6 22h12M10 6h.01M10 10h.01M10 14h.01M14 6h.01M14 10h.01M14 14h.01"/></svg>',
    wrench:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>',
    snowflake:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20M12 2v20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/></svg>',
    droplet:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>',
    fan:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1111 8H2m10.59 11.41A2 2 0 1014 16H2m15.73-8.27A2.5 2.5 0 1119.5 12H2"/></svg>',
    warehouse:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg>',
    clipboard:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>',
    check:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
    chevron:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="9 18 15 12 9 6"/></svg>',
  };

  const IMG = {
    'main-building':    'icons/apps/main-building.jpg',
    'medical-tower':    'icons/apps/medical-tower.jpg',
    'package-units':    'icons/apps/package-units.jpg',
    'exhaust-fans':     'icons/apps/exhaust-fans.jpg',
    'chillers':         'icons/apps/chillers.jpg',
    'chw-pumps':        'icons/apps/chw-pumps.jpg',
    'warehouse':        'icons/apps/warehouse.jpg',
    'material-request': 'icons/apps/material-request.jpg',
    'engineer-approval':'icons/apps/engineer-approval.jpg',
  };

  const SYSTEMS = [
    { id:'dashboard',         label:'Dashboard',          icon:I.dashboard,  badge:'Home',        sub:'Overview & quick links',                        url:null },
    { id:'main-building',     label:'Main Building',      icon:I.building,   badge:'HVAC PPM',    sub:'AHU / FAHU Units · All Floors',                  url:'main.html' },
    { id:'medical-tower',     label:'Medical Tower',      icon:I.tower,      badge:'HVAC PPM',    sub:'AHU / FAHU Units · Tower Floors',                url:'tower.html' },
    { id:'package-units',     label:'Package Units',      icon:I.wrench,     badge:'PPM',         sub:'OPD Package Units · Preventive Maintenance',     url:'package_opd.html' },
    { id:'chillers',          label:'Chillers',           icon:I.snowflake,  badge:'Chillers PPM',sub:'York · Daikin · Royal · Chiller Plant PPM',      url:'chiller_colored.html' },
    { id:'chw-pumps',         label:'CH.W. Pumps',        icon:I.droplet,    badge:'Pumps PPM',   sub:'York · Royal CH.W. Pumps',                       url:'chilled_water_pumps.html' },
    { id:'exhaust-fans',      label:'Exhaust Fans',       icon:I.fan,        badge:'EX Fans PPM', sub:'All Zones — S.B.1 to Zone 9',                    url:'exhaust_fans.html' },
    { id:'warehouse',         label:'Warehouse',          icon:I.warehouse,  badge:'Inventory',   sub:'Store · Stock movements',                        url:'warehouse.html' },
    { id:'material-request',  label:'Material Request',   icon:I.clipboard,  badge:'Request',     sub:'Issue materials · نموذج صرف مواد',               url:'material_request.html' },
    { id:'engineer-approval', label:'Engineer Approval',  icon:I.check,      badge:'Engineer',    sub:'Approve requests · اعتماد الطلبات',              url:'engineer_approval.html' },
  ];

  // ── Role-based access control ───────────────────────────────
  const PPM_IDS = ['main-building','medical-tower','package-units','chillers','chw-pumps','exhaust-fans'];
  const WAREHOUSE_IDS = ['warehouse','material-request','engineer-approval'];

  const ROLE_ACCESS = {
    eng:       SYSTEMS.map(s=>s.id),         // full access
    admin:     SYSTEMS.map(s=>s.id),         // full access
    tech:      ['dashboard', ...PPM_IDS, 'material-request'],
    warehouse: ['dashboard', ...WAREHOUSE_IDS],
  };

  const ROLE_TABS = {
    eng:       ['dashboard','main-building','warehouse','material-request'],
    admin:     ['dashboard','main-building','warehouse','material-request'],
    tech:      ['dashboard','main-building','chillers','exhaust-fans','material-request'],
    warehouse: ['dashboard','warehouse','material-request','engineer-approval'],
  };

  const ROLE_LABELS = { eng:'Engineer', tech:'Technician', warehouse:'Warehouse', admin:'Admin' };

  const ALLOWED_IDS = ROLE_ACCESS[CURRENT_USER.role] || ['dashboard'];
  const VISIBLE_SYSTEMS = SYSTEMS.filter(s => ALLOWED_IDS.includes(s.id));
  const TABS = (ROLE_TABS[CURRENT_USER.role] || ['dashboard']).filter(id => ALLOWED_IDS.includes(id));
  let current = 'dashboard';

  // ── Toast helper ───────────────────────────────────
  window.showToast = function(message, type){
    type = type || 'info';
    const host = document.getElementById('toastHost');
    if(!host) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    host.appendChild(el);
    setTimeout(()=>{
      el.classList.add('out');
      setTimeout(()=>el.remove(), 250);
    }, 2600);
  };

  function renderSidebar(){
    document.getElementById('sideNav').innerHTML = VISIBLE_SYSTEMS.map(s=>{
      const active = s.id===current;
      return `<a href="#" onclick="event.preventDefault();navigate('${s.id}')"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${active?'bg-cyan-500/20 border border-cyan-400/30 text-cyan-300':'text-white/60 hover:text-white hover:bg-white/5'}">
        ${s.icon}<span class="flex-1">${s.label}</span>${active?I.chevron:''}
      </a>`;
    }).join('');
  }

  function renderTabs(){
    document.getElementById('tabNav').innerHTML = TABS.map(id=>{
      const s=SYSTEMS.find(x=>x.id===id);
      const active=s.id===current;
      return `<a href="#" onclick="event.preventDefault();navigate('${s.id}')"
        class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 ${active?'text-cyan-400':'text-white/40'}">
        <div class="p-1.5 rounded-xl ${active?'bg-cyan-500/20':''}">${s.icon}</div>
        <span class="text-[10px] font-medium">${s.label}</span>
      </a>`;
    }).join('');
  }

  function renderDashboard(){
    const cards = VISIBLE_SYSTEMS.filter(s=>s.id!=='dashboard').map((s,i)=>{
      const hasImg = !!IMG[s.id];
      const imgHtml = hasImg
        ? `<img src="${IMG[s.id]}" class="app-icon-img" alt="${s.label}">`
        : `<div class="app-icon-fallback">${s.icon}</div>`;
      return `<button onclick="openCard('${s.id}')" class="app-icon" style="animation:fadeUp .3s ease ${i*0.04}s both" title="${s.label}" aria-label="Open ${s.label}">
        <span class="app-icon-tile">
          ${imgHtml}
          <span class="app-icon-gloss"></span>
          <span class="app-icon-rim"></span>
          <span class="app-icon-badge">${s.badge}</span>
        </span>
        <span class="app-icon-label">${s.label}</span>
      </button>`;
    }).join('');

    return `<div class="max-w-6xl mx-auto">
      <div class="mb-6">
        <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight">Select a maintenance system</h2>
        <p class="mt-1 text-sm text-white/50">Choose a category to view assets, schedules, and work orders.</p>
      </div>
      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-x-5 gap-y-7">${cards}</div>
      <footer class="mt-10 pt-5 border-t border-white/10 text-center text-xs text-white/30">
        CMMS Maintenance System · Al Majal Al Arabi Group · King Faisal Medical Complex
      </footer>
    </div>`;
  }

  function renderSystemPage(s){
    const hasImg=!!IMG[s.id];
    const imgHtml=hasImg?`<img src="${IMG[s.id]}" class="w-full h-full object-cover" alt="${s.label}">`:s.icon;
    return `<div class="max-w-3xl mx-auto">
      <div class="crumb">
        <button onclick="navigate('dashboard')">Dashboard</button>
        <span class="crumb-sep">/</span>
        <span class="crumb-current">${s.label}</span>
      </div>
      <div class="flex items-center gap-3 mb-5">
        <div class="h-12 w-12 rounded-xl overflow-hidden border border-cyan-400/20 flex items-center justify-center bg-cyan-500/10 text-cyan-300">${imgHtml}</div>
        <div><h2 class="text-xl font-semibold">${s.label}</h2><p class="text-sm text-white/50">${s.sub}</p></div>
      </div>
      <div class="bg-gray-900/60 border border-white/10 rounded-2xl p-6">
        <p class="text-white/70 text-sm mb-4">Launch the full ${s.label} module in a focused view.</p>
        <button onclick="openSystem('${s.url}','${s.label.replace(/'/g,"\'")}')"
          class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-semibold text-sm">
          Open ${s.label}
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>`;
  }

  window.navigate=(id)=>{
    if(!ALLOWED_IDS.includes(id)) id='dashboard';
    const s=SYSTEMS.find(x=>x.id===id);
    if(s&&s.url&&id!=='dashboard'){openSystem(s.url,s.label);return;}
    current=id;
    const page=document.getElementById('page');
    page.classList.remove('route-enter');void page.offsetWidth;page.classList.add('route-enter');
    page.innerHTML=id==='dashboard'?renderDashboard():renderSystemPage(s);
    const backBtn=document.getElementById('backBtn');
    const menuBtn=document.getElementById('menuBtn');
    const isRoot=TABS.includes(id)||id==='dashboard';
    backBtn.classList.toggle('hidden',isRoot);backBtn.classList.toggle('flex',!isRoot);
    menuBtn.classList.toggle('hidden',!isRoot);
    renderSidebar();renderTabs();closeSidebar();window.scrollTo(0,0);
  };

  window.openCard=(id)=>{if(!ALLOWED_IDS.includes(id))return;const s=SYSTEMS.find(x=>x.id===id);if(s.url)openSystem(s.url,s.label);else navigate(id);};
  window.openSystem=(url,title)=>{if(!url)return;document.getElementById('systemTitle').textContent=title||'';document.getElementById('systemFrame').src=url;document.getElementById('systemView').classList.remove('hidden');};
  window.closeSystem=()=>{document.getElementById('systemView').classList.add('hidden');document.getElementById('systemFrame').src='about:blank';};
  window.goBack=()=>navigate('dashboard');
  window.openSidebar=()=>{document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('overlay').classList.remove('hidden');};
  window.closeSidebar=()=>{if(window.innerWidth<1024){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('overlay').classList.add('hidden');}};
  window.toggleNotif=()=>document.getElementById('notifPanel').classList.toggle('hidden');
  window.confirmLogout=()=>{closeSystem();closeSidebar();document.getElementById('logoutDlg').classList.remove('hidden');};
  window.doLogout=()=>{
    try{
      // Clear session data
      localStorage.removeItem('cmms_user');
      localStorage.removeItem('cmms_session');
      sessionStorage.removeItem('cmms_user');
      sessionStorage.removeItem('cmms_session');
      // Clear remember-me so login form doesn't auto-fill after logout
      localStorage.removeItem('cmms_remember');
      localStorage.removeItem('cmms_iqama');
      localStorage.removeItem('cmms_fileno');
    }catch(e){}
    if(window.showToast) window.showToast('Signed out successfully','success');
    setTimeout(()=>window.location.replace('login.html'), 250);
  };

  renderSidebar();renderTabs();navigate('dashboard');

  // ── Hide splash screen once first paint is ready ──────────
  (function hideSplash(){
    const splash = document.getElementById('splash');
    if(!splash) return;
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        splash.classList.add('fade-out');
        setTimeout(()=>splash.remove(), 450);
      }, 350);
    });
  })();

  // ── Populate user name & position from login session ──────────
  (function loadUserInfo(){
    try{
      var name = CURRENT_USER.name || CURRENT_USER.fullName || CURRENT_USER.userName || CURRENT_USER.username || '';
      var role = ROLE_LABELS[CURRENT_USER.role] || CURRENT_USER.role || CURRENT_USER.position || CURRENT_USER.jobTitle || CURRENT_USER.type || '';
      if(name) document.getElementById('sidebarUserName').textContent = name;
      if(role) document.getElementById('sidebarUserRole').textContent = role;
    }catch(e){}
  })();

  // ── Theme toggle ──────────────────────────────────────────
  (function initTheme(){
    const saved = localStorage.getItem('cmms_theme');
    if(saved === 'light') applyTheme('light');
  })();

  function applyTheme(mode){
    const isLight = mode === 'light';
    document.body.classList.toggle('light-mode', isLight);
    document.getElementById('iconSun').classList.toggle('hidden', isLight);
    document.getElementById('iconMoon').classList.toggle('hidden', !isLight);
    document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
    // Push theme into any open iframe
    const frame = document.getElementById('systemFrame');
    if(frame && frame.contentWindow){
      try{ frame.contentWindow.postMessage({cmmsTheme: mode}, '*'); }catch(e){}
    }
  }

  window.toggleTheme = function(){
    const isLight = document.body.classList.contains('light-mode');
    const next = isLight ? 'dark' : 'light';
    localStorage.setItem('cmms_theme', next);
    applyTheme(next);
  };

  // Re-apply theme when a new iframe loads
  document.getElementById('systemFrame').addEventListener('load', function(){
    const mode = localStorage.getItem('cmms_theme') || 'dark';
    try{ this.contentWindow.postMessage({cmmsTheme: mode}, '*'); }catch(e){}
  });
</script>
