<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- background -->
    <rect width="512" height="512" rx="90" fill="#0a2e5c"/>
    <!-- snowflake arms (6 × 60°) -->
    <g stroke="#00b4d8" stroke-linecap="round" stroke-width="28" fill="none"
       transform="translate(256,240)">
      <!-- 0° / 180° -->
      <line x1="0" y1="-140" x2="0" y2="140"/>
      <!-- branches at 0° arm -->
      <line x1="0" y1="-90"  x2="-45" y2="-125"/>
      <line x1="0" y1="-90"  x2=" 45" y2="-125"/>
      <line x1="0" y1=" 90"  x2="-45" y2=" 125"/>
      <line x1="0" y1=" 90"  x2=" 45" y2=" 125"/>

      <!-- 60° / 240° -->
      <line x1="-121.2" y1="-70" x2="121.2" y2="70"/>
      <!-- branches -->
      <line x1="-78" y1="-45"  x2="-118" y2="-10"/>
      <line x1="-78" y1="-45"  x2="-52"  y2="-88"/>
      <line x1=" 78" y1=" 45"  x2=" 118" y2=" 10"/>
      <line x1=" 78" y1=" 45"  x2="  52" y2="  88"/>

      <!-- 120° / 300° -->
      <line x1="121.2" y1="-70" x2="-121.2" y2="70"/>
      <!-- branches -->
      <line x1=" 78" y1="-45"  x2=" 118" y2="-10"/>
      <line x1=" 78" y1="-45"  x2="  52" y2="-88"/>
      <line x1="-78" y1=" 45"  x2="-118" y2=" 10"/>
      <line x1="-78" y1=" 45"  x2="-52"  y2="  88"/>

      <!-- centre dot -->
      <circle cx="0" cy="0" r="18" fill="#00b4d8" stroke="none"/>
    </g>
    <!-- CMMS label -->
    <text x="256" y="435"
          font-size="68" text-anchor="middle" fill="#ffffff"
          font-family="Arial,Helvetica,sans-serif" font-weight="700"
          letter-spacing="6">CMMS</text>
    <!-- subtitle -->
    <text x="256" y="485"
          font-size="30" text-anchor="middle" fill="rgba(255,255,255,0.65)"
          font-family="Arial,Helvetica,sans-serif">KFMC · AL MAJAL</text>
  </svg>