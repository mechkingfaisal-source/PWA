<style>
:root {
  --radius: 0.875rem;
  --background: #f8fafc; --foreground: #0f172a;
  --card: #ffffff; --card-foreground: #0f172a;
  --primary: #1e293b; --primary-foreground: #f8fafc;
  --secondary: #f1f5f9; --secondary-foreground: #1e293b;
  --muted: #f1f5f9; --muted-foreground: #64748b;
  --accent: #f1f5f9; --accent-foreground: #1e293b;
  --destructive: #dc2626; --destructive-foreground: #ffffff;
  --border: #e2e8f0; --input: #e2e8f0; --ring: #6366f1;
  --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6; --orange: #f97316;
  --chart-1:#1e293b; --chart-2:#3b82f6; --chart-3:#22c55e; --chart-4:#f59e0b; --chart-5:#f97316;
  --sidebar:#0f172a; --sidebar-foreground:#e2e8f0; --sidebar-primary:#3b82f6; --sidebar-primary-foreground:#ffffff;
  --sidebar-accent:#1e293b; --sidebar-accent-foreground:#e2e8f0; --sidebar-border:#1e293b;
}
.dark {
  --background: #0b0f19; --foreground: #e2e8f0;
  --card: #111827; --card-foreground: #e2e8f0;
  --primary: #60a5fa; --primary-foreground: #0b0f19;
  --secondary: #1e293b; --secondary-foreground: #e2e8f0;
  --muted: #1e293b; --muted-foreground: #94a3b8;
  --accent: #1e293b; --accent-foreground: #e2e8f0;
  --border: rgba(255,255,255,0.1); --input: rgba(255,255,255,0.15);
  --chart-1:#60a5fa; --chart-2:#818cf8; --chart-3:#4ade80; --chart-4:#f59e0b; --chart-5:#fb923c;
  --sidebar:#0b0f19; --sidebar-foreground:#cbd5e1; --sidebar-primary:#60a5fa; --sidebar-primary-foreground:#ffffff;
  --sidebar-accent:#1e293b; --sidebar-accent-foreground:#e2e8f0; --sidebar-border:rgba(255,255,255,0.1);
}
* { box-sizing: border-box; margin: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--background); color: var(--foreground); line-height: 1.5; }
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--sidebar); color: var(--sidebar-foreground); display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 50; transform: translateX(-100%); transition: transform .2s; }
.sidebar.open { transform: translateX(0); }
.sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--sidebar-border); }
.sidebar-brand-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--sidebar-primary); color: var(--sidebar-primary-foreground); display: flex; align-items: center; justify-content: center; }
.sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; }
.sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--sidebar-foreground); font-size: 13.5px; font-weight: 500; margin-bottom: 2px; transition: .15s; }
.sidebar-nav a:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.sidebar-nav a.active { background: var(--sidebar-primary); color: var(--sidebar-primary-foreground); }
.sidebar-footer { padding: 12px 20px; font-size: 11px; opacity: .5; border-top: 1px solid var(--sidebar-border); }
.main { flex: 1; margin-left: 0; display: flex; flex-direction: column; min-width: 0; }
.header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--card) 80%, transparent); backdrop-filter: blur(10px); }
.content { flex: 1; padding: 20px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: none; }
.overlay.show { display: block; }

@media(min-width:1024px) {
  .sidebar { transform: translateX(0); position: static; }
  .main { margin-left: 260px; }
  .menu-btn, .overlay { display: none !important; }
}

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.kpi-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 16px; }
@media(min-width:768px){ .kpi-grid { grid-template-columns: repeat(4,1fr); } }
.kpi { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); }
.kpi-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.kpi-label { font-size: 12px; color: var(--muted-foreground); }
.kpi-hint { font-size: 11px; color: var(--muted-foreground); margin-top: 2px; }
.kpi-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--secondary); display: flex; align-items: center; justify-content: center; }

.page-header { margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-header h2 { font-size: 22px; font-weight: 700; }
.page-header p { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }

input, select, textarea, button { font-family: inherit; font-size: 14px; }
input, select, textarea { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 20%, transparent); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--accent); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.btn-primary:hover { opacity: .9; }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge-normal { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
.badge-low  { background: color-mix(in srgb, var(--warning) 20%, transparent); color: #b45309; }
.badge-critical { background: color-mix(in srgb, var(--orange) 15%, transparent); color: var(--orange); }
.badge-out { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.dark .badge-low { color: #fbbf24; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase; color: var(--muted-foreground); background: var(--secondary); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
tr:hover { background: color-mix(in srgb, var(--accent) 50%, transparent); }

.tx-card { border-left: 4px solid var(--border); background: var(--card); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.tx-in { border-left-color: var(--success); }
.tx-out { border-left-color: var(--danger); }
.tx-count { border-left-color: var(--info); }

.page { display: none; }
.page.active { display: block; }

.user-pill { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: var(--secondary); font-size: 12px; font-weight: 600; }
.user-avatar { width: 28px; height: 28px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; }

.toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.1); font-size: 13px; animation: toastIn .3s; min-width: 220px; }
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.top-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; background: var(--card); transition: .15s; }
.top-item:hover { background: var(--accent); }

.cat-chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }

.sparkline { width: 100%; height: 28px; }

.detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }

@media print { .no-print { display: none !important; } }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
</style>
</head>

const LS_KEY = 'kfmc-warehouse-v1';

function $(id){ return document.getElementById(id); }
function fmtSAR(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'SAR',maximumFractionDigits:0}).format(n); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function stockStatus(i){ if(i.stock<=0) return 'out'; if(i.stock<=Math.max(1,Math.ceil(i.minStock*.5))) return 'critical'; if(i.stock<=i.minStock) return 'low'; return 'normal'; }
function forecast(i){ if(!i.monthlyAvg || i.monthlyAvg<=0) return {m:null,fc:'unknown'}; const m=i.stock/i.monthlyAvg; let fc='safe'; if(m<1) fc='immediate'; else if(m<3) fc='reorder'; return {m,fc}; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function now(){ return new Date().toISOString().slice(0,10); }

let state = (()=>{ try{ const r=localStorage.getItem(LS_KEY); if(r){ const p=JSON.parse(r); if(p&&p.items&&p.items.length) return p; } }catch(e){} return {items:SEED_DATA.items.slice(),transactions:[],purchaseRequests:[]}; })();
function save(){ localStorage.setItem(LS_KEY,JSON.stringify(state)); }

const PAGES = ['dashboard','inventory','min-quantity','receiving','issue','approved-requests','purchase-requests','alerts','transactions','reports','stock-count','settings'];
const LABELS = {dashboard:'Dashboard',inventory:'Inventory','min-quantity':'Min Qty Manager',receiving:'Receiving',issue:'Issue Material','approved-requests':'✅ Approved Requests',  'purchase-requests':'Purchase Requests',alerts:'Alerts',transactions:'Transactions',reports:'Reports','stock-count':'Stock Count',settings:'Settings'};
const ICONS = {dashboard:'📊',inventory:'📦','min-quantity':'🔔',receiving:'📥',issue:'📤','approved-requests':'📬','purchase-requests':'🛒',alerts:'🚨',transactions:'📋',reports:'📈','stock-count':'📋',settings:'⚙️'};

let currentPage = 'dashboard';

function renderNav(){
  const alertCount = state.items.filter(i=>{ const s=stockStatus(i); return s==='low'||s==='critical'||s==='out'; }).length;
  const minQtyAlarms = state.items.filter(i=>i.stock <= i.minStock).length;
  const openPR = state.purchaseRequests.filter(p=>p.status==='Open').length;
  $('nav').innerHTML = PAGES.map(p=>{
    const count = p==='alerts'?alertCount : p==='purchase-requests'?openPR : p==='min-quantity'?minQtyAlarms : p==='approved-requests'?_approvedCount : 0;
    const active = p===currentPage?'active':'';
    const badgeColor = p==='approved-requests' ? 'var(--success)' : 'var(--danger)';
    return `<a href="#" class="${active}" onclick="go('${p}');return false;"><span>${ICONS[p]}</span><span style="flex:1">${LABELS[p]}</span>${count>0?`<span style="background:${badgeColor};color:#fff;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700">${count}</span>`:''}</a>`;
  }).join('');
}

function go(page){
  currentPage = page;
  PAGES.forEach(p=>{ const el=$(p); if(el) el.classList.toggle('active',p===page); });
  renderNav();
  window.scrollTo(0,0);
  if(page==='dashboard') renderDashboard();
  if(page==='inventory') renderInventory();
  if(page==='min-quantity') renderMinQty();
  if(page==='alerts') renderAlerts();
  if(page==='receiving') renderReceiving();
  if(page==='issue') renderIssue();
  if(page==='transactions') renderTransactions();
  if(page==='approved-requests') renderApprovedRequests();
  if(page==='purchase-requests') renderPRs();
  if(page==='reports') renderReports();
  if(page==='stock-count') renderStockCount();
}

function toast(msg,type='success'){
  const t = document.createElement('div');
  t.className = 'toast '+type; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

function toggleSidebar(){
  $('sidebar').classList.toggle('open');
  $('overlay').classList.toggle('show');
}

function toggleDark(){
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('kfmc-theme', document.documentElement.classList.contains('dark')?'dark':'light');
}
if(localStorage.getItem('kfmc-theme')==='dark') document.documentElement.classList.add('dark');

function drawBarChart(id,data){
  const c=document.getElementById(id); if(!c) return;
  const ctx=c.getContext('2d');
  const rect=c.parentElement.getBoundingClientRect();
  c.width=rect.width; c.height=260;
  const w=c.width, h=c.height, pad=40;
  const max=Math.max(1,...data.map(d=>d.qty));
  const barW=(w-pad*2)/data.length*.6;
  const gap=(w-pad*2)/data.length;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted-foreground').trim();
  ctx.font='11px sans-serif';
  ctx.textAlign='center';
  data.forEach((d,i)=>{
    const x=pad+i*gap+(gap-barW)/2;
    const bh=(d.qty/max)*(h-pad*2);
    const y=h-pad-bh;
    ctx.fillStyle='var(--chart-1)';
    ctx.fillRect(x,y,barW,bh);
    ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted-foreground').trim();
    ctx.fillText(d.month,x+barW/2,h-8);
  });
}
function drawPieChart(id,data){
  const c=document.getElementById(id); if(!c) return;
  const ctx=c.getContext('2d');
  const rect=c.parentElement.getBoundingClientRect();
  c.width=rect.width; c.height=220;
  const w=c.width, h=c.height, r=Math.min(w,h)*.35;
  const cx=w/2, cy=h/2;
  const colors=['#1e293b','#3b82f6','#22c55e','#f59e0b','#f97316','#6366f1'];
  const total=data.reduce((s,d)=>s+d[1],0)||1;
  let a=-Math.PI/2;
  data.forEach((d,i)=>{
    const slice=(d[1]/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a,a+slice); ctx.closePath();
    ctx.fillStyle=colors[i%colors.length]; ctx.fill();
    a+=slice;
  });
}

        </table>

    const max=Math.max(1,...catData.map(d=>d.value));
    const barH=(h-pad*2)/catData.length*.5;
    const gap=(h-pad*2)/catData.length;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted-foreground').trim();
    ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
    const colors=['#1e293b','#3b82f6','#22c55e','#f59e0b','#f97316','#6366f1'];

      const y=pad+i*gap+(gap-barH)/2;
      const bw=(d.value/max)*(w-pad*2-100);
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillRect(pad+100,y,bw,barH);
      ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--foreground').trim();

    });
  });

  $('stock-count').innerHTML = `

function saveCount(id){
  const v=scCounts[id]; if(v===undefined||v===''){ toast('Enter physical count','error'); return; }
  const item=state.items.find(i=>i.id===id); if(!item) return;
  const actual=Number(v); const variance=actual-item.stock;
  item.stock=actual; item.lastCount=now();
  state.transactions.unshift({id:uid(),type:'count',itemId:id,itemName:item.name,qty:variance,unit:item.unit,user:'Store Keeper',note:`Physical: ${actual}, System: ${item.stock}, Variance: ${variance}`,ts:Date.now()});
  delete scCounts[id]; save(); toast('Count recorded'); renderNav(); renderStockCount();
}

        <span style="font-size:12px;color:var(--muted-foreground)">${filtered.length} items</span>
      </div>
    </div>

    <!-- TABLE -->
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Material</th>
              <th>Category</th>
              <th style="text-align:center">Current Stock</th>
              <th style="text-align:center">Min Qty</th>
              <th style="text-align:center">Alarm Status</th>
              <th style="text-align:center">Set New Min</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(i=>{
              const alarm = i.stock <= i.minStock;
              const critical = i.stock <= 0;
              const alarmColor = critical ? 'var(--danger)' : alarm ? 'var(--warning)' : 'var(--success)';
              const alarmIcon = critical ? '❌ Out of Stock' : alarm ? '⚠️ ALARM' : '✅ OK';
              const rowBg = critical ? 'background:color-mix(in srgb,var(--danger) 6%,transparent)' : alarm ? 'background:color-mix(in srgb,var(--warning) 8%,transparent)' : '';
              return `<tr style="${rowBg}">
                <td style="font-family:monospace;font-size:11px;color:var(--muted-foreground)">${i.code}</td>
                <td style="font-weight:500;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i.name}</td>
                <td style="font-size:12px;color:var(--muted-foreground)">${i.category}</td>
                <td style="text-align:center;font-weight:700;color:${alarmColor}">${i.stock} ${i.unit}</td>
                <td style="text-align:center;font-weight:600">${i.minStock} ${i.unit}</td>
                <td style="text-align:center;font-weight:700;font-size:12px;color:${alarmColor}">${alarmIcon}</td>
                <td style="text-align:center">
                  <div style="display:flex;align-items:center;justify-content:center;gap:6px">
                    <input type="number" id="mq_${i.id}" value="${i.minStock}" min="0" style="width:72px;text-align:center;padding:4px 6px;font-size:13px" onkeydown="if(event.key==='Enter')mqSave(${i.id})">
                    <button class="btn btn-primary" style="padding:5px 10px;font-size:12px" onclick="mqSave(${i.id})">Save</button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function mqSave(id){
  const input = document.getElementById('mq_'+id);
  if(!input) return;
  const val = parseInt(input.value);
  if(isNaN(val) || val < 0){ toast('Enter a valid min quantity (≥ 0)','error'); return; }
  const item = state.items.find(i=>i.id===id); if(!item) return;
  const old = item.minStock;
  item.minStock = val;
  save(); renderNav();
  // Flash feedback
  input.style.borderColor = 'var(--success)';
  setTimeout(()=>{ input.style.borderColor=''; },1500);
  const wasAlarm = item.stock <= old;
  const nowAlarm = item.stock <= val;
  if(!wasAlarm && nowAlarm) toast(`⚠️ ALARM: ${item.name} is now at or below min (${val})!`, 'error');
  else toast(`Min qty updated: ${item.name} → ${val} ${item.unit}`);
  // Re-render to update alarm banner
  setTimeout(()=>renderMinQty(), 300);
}

function mqBulkSet(){
  const cat = document.getElementById('mqBulkCat').value;
  const val = parseInt(document.getElementById('mqBulkQty').value);
  if(isNaN(val) || val < 0){ toast('Enter a valid quantity','error'); return; }
  const affected = state.items.filter(i=>i.category===cat);
  affected.forEach(i=>i.minStock=val);
  save(); renderNav(); renderMinQty();
  toast(`Min qty set to ${val} for ${affected.length} items in "${cat}"`);
}

function mqCreatePR(id){
  const item = state.items.find(i=>i.id===id); if(!item) return;
  const qty = Math.max(item.minStock * 2 - item.stock, item.minStock, 1);
  const prId = 'PR-'+new Date().getFullYear()+'-'+String(state.purchaseRequests.length+1).padStart(3,'0');
  state.purchaseRequests.unshift({id:prId,itemId:item.id,itemName:item.name,qty,unit:item.unit,status:'Open',requestedBy:'Store Keeper',note:'Auto from Min Qty alarm',ts:Date.now()});
  save(); renderNav(); toast(`Purchase request created: ${qty} ${item.unit} of ${item.name}`);
  if(currentPage==='min-quantity') renderMinQty();
}

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const MAT_COL = 'material_requests';

var _approvedRequests = [];
var _approvedCount = 0;
var _arUnsubscribe = null;

function startApprovedListener() {
  if (_arUnsubscribe) return; // already listening
  _arUnsubscribe = db.collection(MAT_COL)
    .where('status', 'in', ['Approved', 'Partial'])
    .onSnapshot(function(snap) {
      _approvedRequests = [];
      snap.forEach(function(doc) {
        _approvedRequests.push(Object.assign({ _id: doc.id }, doc.data()));
      });
      // Sort client-side by createdAt descending (avoids composite index requirement)
      _approvedRequests.sort(function(a, b) {
        var ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : (a.createdAt ? new Date(a.createdAt).getTime() : 0);
        var tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : (b.createdAt ? new Date(b.createdAt).getTime() : 0);
        return tb - ta;
      });
      _approvedCount = _approvedRequests.length;
      renderNav();
      // Update badge in header
      var badge = document.getElementById('wh-notif-badge');
      if (badge) {
        badge.style.display = _approvedCount > 0 ? 'flex' : 'none';
        badge.textContent = '📬 ' + _approvedCount + ' طلب معتمد';
      }
      if (currentPage === 'approved-requests') renderApprovedRequests();
    }, function(err) {
      console.warn('Firestore listener error:', err.message);
    });
}

function renderApprovedRequests() {
  var pg = $('approved-requests');
  if (!pg) return;

  if (!_approvedRequests.length) {
    pg.innerHTML = `
      <div class="page-header"><div><h2>📬 Approved Material Requests</h2><p>Requests approved by engineer — ready to dispense.</p></div></div>
      <div class="card" style="text-align:center;padding:40px;color:var(--muted-foreground)">
        <div style="font-size:40px;margin-bottom:12px">✅</div>
        <div style="font-size:15px;font-weight:600">No approved requests pending dispatch.</div>
        <div style="font-size:13px;margin-top:6px">All requests have been dispensed or none have been approved yet.</div>
      </div>`;
    return;
  }

  var html = `
    <div class="page-header">
      <div><h2>📬 Approved Material Requests</h2><p>${_approvedRequests.length} requests ready for dispatch — طلبات جاهزة للصرف</p></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">`;

  _approvedRequests.forEach(function(req) {
    var dateStr = '';
    try { dateStr = new Date(req.date).toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e) { dateStr = req.date || ''; }
    var engDate = '';
    try { engDate = new Date(req.engDate).toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e) { engDate = req.engDate || ''; }
    var priBadge = req.priority === 'Urgent' ? '<span style="background:#fff3e0;color:#e65100;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid #e65100">🟠 Urgent</span>' :
                   req.priority === 'Critical' ? '<span style="background:#ffebee;color:#c62828;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid #c62828">🔴 Critical</span>' : '';
    var statusBadge = req.status === 'Partial' ?
      '<span style="background:#e3f2fd;color:#1565c0;padding:2px 10px;border-radius:8px;font-size:12px;font-weight:700">⚠️ Partial Approval</span>' :
      '<span style="background:#e8f5e9;color:#2e7d32;padding:2px 10px;border-radius:8px;font-size:12px;font-weight:700">✅ Approved</span>';

    var itemsRows = '';
    if (req.items && req.items.length) {
      req.items.forEach(function(it) {
        var whItem = state.items.find(function(w) { return w.id === it.matId || w.name.toLowerCase().trim() === (it.matName||'').toLowerCase().trim(); });
        var whStock = whItem ? whItem.stock : it.inStock;
        var stockColor = whStock <= 0 ? '#c62828' : whStock < it.qty ? '#e65100' : '#2e7d32';
        var warning = whStock < it.qty ? '<span style="color:#e65100;font-size:10px;font-weight:700"> ⚠️ Low</span>' : '';
        itemsRows += `<tr>
          <td style="padding:6px 10px">${it.matName}</td>
          <td style="padding:6px 10px;text-align:center;font-weight:700">${it.qty} ${it.unit}</td>
          <td style="padding:6px 10px;text-align:center;font-weight:700;color:${stockColor}">${whStock}${warning}</td>
        </tr>`;
      });
    }

    html += `
      <div class="card" style="padding:0;overflow:hidden;border-left:5px solid #2e7d32">
        <div style="padding:14px 16px;background:var(--secondary);display:flex;flex-wrap:wrap;align-items:center;gap:10px">
          <div style="flex:1;min-width:200px">
            <div style="font-size:15px;font-weight:900;color:var(--foreground)">${req.reqNo}</div>
            <div style="font-size:12px;color:var(--muted-foreground);margin-top:2px">${dateStr} · 👷 ${req.techName} · 🏢 ${req.building}</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${priBadge}${statusBadge}</div>
        </div>
        <div style="padding:14px 16px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;font-size:13px">
            <div><span style="color:var(--muted-foreground)">Work Order:</span> <b>${req.workOrder || '—'}</b></div>
            <div><span style="color:var(--muted-foreground)">Engineer:</span> <b>${req.engName || '—'}</b></div>
            <div style="grid-column:span 2"><span style="color:var(--muted-foreground)">Reason:</span> ${req.reason || '—'}</div>
            ${req.engNotes ? `<div style="grid-column:span 2"><span style="color:var(--muted-foreground)">Eng. Notes:</span> <i>${req.engNotes}</i></div>` : ''}
            <div><span style="color:var(--muted-foreground)">Approved at:</span> ${engDate}</div>
          </div>
          <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px">
            <thead><tr style="background:var(--primary);color:var(--primary-foreground)">
              <th style="padding:7px 10px;text-align:left">Material المادة</th>
              <th style="padding:7px 10px;text-align:center">Qty الكمية</th>
              <th style="padding:7px 10px;text-align:center">WH Stock مخزون</th>
            </tr></thead>
            <tbody>${itemsRows}</tbody>
          </table>
          <button onclick="dispenseRequest('${req._id}')" style="width:100%;padding:13px;background:linear-gradient(135deg,#2e7d32,#388e3c);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:900;cursor:pointer;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px">
            🏭 صرف الطلب — Dispense Request
          </button>
        </div>
      </div>`;
  });

  html += '</div>';
  pg.innerHTML = html;
}

function dispenseRequest(docId) {
  var req = _approvedRequests.find(function(r) { return r._id === docId; });
  if (!req) { toast('Request not found', 'error'); return; }

  // Check for insufficient stock before confirming
  var stockWarnings = [];
  if (req.items && req.items.length) {
    req.items.forEach(function(it) {
      var whItem = state.items.find(function(w) {
        return w.id === Number(it.matId) ||
               w.id === it.matId ||
               w.name.toLowerCase().trim() === (it.matName||'').toLowerCase().trim() ||
               (w.code && it.matCode && w.code === it.matCode);
      });
      var avail = whItem ? whItem.stock : 0;
      if (avail < it.qty) {
        stockWarnings.push((it.matName||'?') + ': طلب ' + it.qty + ' · متاح ' + avail);
      }
    });
  }

  var confirmMsg = 'تأكيد صرف الطلب ' + req.reqNo + ' ؟\nConfirm dispensing request ' + req.reqNo + '?';
  if (stockWarnings.length) {
    confirmMsg += '\n\n⚠️ تحذير — رصيد منخفض:\n' + stockWarnings.join('\n');
  }
  if (!confirm(confirmMsg)) return;

  var dispensedBy = 'Warehouse Keeper';
  try {
    var u = JSON.parse(sessionStorage.getItem('cmms_user') || localStorage.getItem('cmms_user') || '{}');
    if (u && u.name) dispensedBy = u.name;
  } catch(e) {}

  // Deduct from warehouse state (localStorage)
  var deductedItems = [];
  if (req.items && req.items.length) {
    req.items.forEach(function(it) {
      var whItem = state.items.find(function(w) {
        return w.id === Number(it.matId) ||
               w.id === it.matId ||
               w.name.toLowerCase().trim() === (it.matName||'').toLowerCase().trim() ||
               (w.code && it.matCode && w.code === it.matCode);
      });
      if (whItem) {
        var deducted = Math.min(it.qty, whItem.stock);
        whItem.stock = Math.max(0, whItem.stock - it.qty);
        whItem.lastIssued = now();
        state.transactions.unshift({
          id: uid(), type: 'out', itemId: whItem.id, itemName: whItem.name,
          qty: deducted, unit: it.unit || whItem.unit, user: req.techName || dispensedBy,
          workOrder: (req.reqNo || '') + (req.workOrder ? ' / ' + req.workOrder : ''),
          note: 'صرف طلب معتمد — مهندس: ' + (req.engName || '—') + ' · مستودع: ' + dispensedBy,
          ts: Date.now()
        });
        deductedItems.push(whItem.name + ': -' + deducted + ' ' + (it.unit || whItem.unit));
      } else {
        // Item not found in warehouse — log without deduction
        state.transactions.unshift({
          id: uid(), type: 'out', itemId: 0, itemName: it.matName || 'غير معروف',
          qty: it.qty, unit: it.unit || 'pcs', user: req.techName || dispensedBy,
          workOrder: (req.reqNo || '') + (req.workOrder ? ' / ' + req.workOrder : ''),
          note: '⚠️ لم يُوجد في المخزون — ' + dispensedBy,
          ts: Date.now()
        });
      }
    });
    save();
    renderNav();
  }

  // Update Firebase status to Dispensed
  db.collection(MAT_COL).doc(docId).update({
    status: 'Dispensed',
    dispatchedBy: dispensedBy,
    dispatchedAt: new Date().toISOString(),
    dispensedItems: deductedItems
  }).then(function() {
    toast('✅ تم صرف الطلب بنجاح — ' + req.reqNo);
    if (currentPage === 'inventory' || currentPage === 'dashboard') go(currentPage);
  }).catch(function(err) {
    toast('❌ Firebase error: ' + err.message, 'error');
  });
}

renderNav();

startApprovedListener();
