<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HVAC Warehouse — CMMS KFMC</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;color:#0d1b2a;min-height:100vh}
:root{--blue:#0a2e5c;--blue2:#1565c0;--green:#2e7d32;--red:#c62828;--orange:#e65100;--gold:#f9a825;--light:#e3f2fd;--border:#b0c4de}

/* ── TOP HEADER ── */
.header{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px #0005}
.header h1{font-size:16px;font-weight:900;flex:1}
.header .user-badge{background:#fff2;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}
.header .back-btn{background:#fff2;border:none;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700}

/* ── STATS BAR ── */
.stats-bar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:2px solid var(--border);overflow-x:auto;flex-wrap:nowrap}
.stat-box{background:var(--blue);color:#fff;border-radius:10px;padding:8px 14px;min-width:90px;text-align:center;flex-shrink:0}
.stat-box.green{background:var(--green)}
.stat-box.red{background:var(--red)}
.stat-box.orange{background:var(--orange)}
.stat-box .val{font-size:20px;font-weight:900}
.stat-box .lbl{font-size:10px;opacity:.85;margin-top:2px}

/* ── TABS ── */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);overflow-x:auto}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;color:#555;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;font-family:Arial,sans-serif;background:#fff;outline:none}
.toolbar input{flex:1;min-width:150px}
.btn{border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:700;font-family:Arial}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-gold{background:var(--gold);color:#000}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--blue);color:#fff;padding:9px 10px;text-align:left;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid #e8eef5;vertical-align:middle}
tr:hover td{background:#f0f7ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-green{background:#e8f5e9;color:var(--green)}
.badge-red{background:#ffebee;color:var(--red)}
.badge-orange{background:#fff3e0;color:var(--orange)}
.badge-blue{background:#e3f2fd;color:var(--blue2)}
.cat-chip{display:inline-block;background:#e3f2fd;color:var(--blue);padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700}

/* ── MODALS ── */
.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:200;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:95%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px #0003}
.modal h2{color:var(--blue);font-size:16px;margin-bottom:16px;border-bottom:2px solid var(--border);padding-bottom:8px}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.form-row label{font-size:12px;font-weight:700;color:#555}
.form-row input,.form-row select,.form-row textarea{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:Arial;outline:none;width:100%}
.form-row textarea{resize:vertical;min-height:60px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── TRANSACTION LOG ── */
.tx-item{border-left:4px solid var(--blue);padding:8px 12px;margin-bottom:8px;background:#f8faff;border-radius:0 8px 8px 0}
.tx-item.out{border-color:var(--red)}
.tx-item.in{border-color:var(--green)}
.tx-item .tx-head{font-weight:700;font-size:13px}
.tx-item .tx-sub{font-size:11px;color:#666;margin-top:3px}

/* ── ALERTS ── */
.alert-card{background:#fff3e0;border:1.5px solid #ffb74d;border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.alert-card.critical{background:#ffebee;border-color:#ef9a9a}
.alert-card .al-name{font-weight:700;font-size:13px}
.alert-card .al-qty{font-size:12px;color:#555}

/* ── PRINT ── */
@media print{.no-print{display:none!important}.tbl-wrap{overflow:visible}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header no-print">
  <div>
    <div style="font-size:10px;opacity:.7">CMMS KFMC — AL MAJAL AL ARABI GROUP</div>
    <h1>🏭 Mechanical Warehouse Management</h1>
  </div>
  <span class="user-badge" id="userBadge">👷 —</span>
  <button class="back-btn" onclick="goBack()">← Back</button>
</div>

<!-- STATS -->
<div class="stats-bar no-print" id="statsBar"></div>

<!-- TABS -->
<div class="tabs no-print" id="tabs">
  <div class="tab active" onclick="switchTab('inventory')">📦 Inventory</div>
  <div class="tab" onclick="switchTab('transactions')">📋 Transactions</div>
  <div class="tab" onclick="switchTab('alerts')">🚨 Low Stock Alerts</div>
  <div class="tab" onclick="switchTab('request')">📤 Issue Material</div>
</div>

<!-- TOOLBAR -->
<div class="toolbar no-print" id="toolbar">
  <input type="text" id="searchBox" placeholder="🔍 Search material..." oninput="renderInventory()">
  <select id="catFilter" onchange="renderInventory()">
    <option value="">All Categories</option>
    <option>Rubber Belts</option>
    <option>Refrigerant Gas</option>
    <option>Electrical</option>
    <option>Motors</option>
    <option>Compressors</option>
    <option>Piping</option>
    <option>Insulation & Tapes</option>
    <option>Filters</option>
    <option>Fittings & Valves</option>
    <option>Chemicals & Sealants</option>
    <option>General</option>
  </select>
  <select id="stockFilter" onchange="renderInventory()">
    <option value="">All Stock</option>
    <option value="low">⚠️ Low Stock</option>
    <option value="zero">🔴 Zero Stock</option>
    <option value="ok">✅ OK Stock</option>
  </select>
  <button class="btn btn-green no-print" onclick="openReceiveModal()">➕ Receive Stock</button>
  <button class="btn btn-blue no-print" onclick="openAddItemModal()">🆕 Add Item</button>
  <button class="btn btn-gold no-print" onclick="printInventory()">🖨️ Print</button>
</div>

<!-- CONTENT -->
<div id="content"></div>

<!-- MODALS -->
<!-- Issue Material -->
<div class="overlay" id="issueOverlay">
  <div class="modal">
    <h2>📤 Issue Material to Technician</h2>
    <div class="form-row">
      <label>Material</label>
      <select id="issueMat"></select>
    </div>
    <div class="form-row">
      <label>Quantity</label>
      <input type="number" id="issueQty" min="1" value="1">
    </div>
    <div class="form-row">
      <label>Technician Name</label>
      <input type="text" id="issueTech" placeholder="Technician name...">
    </div>
    <div class="form-row">
      <label>Work Order / Equipment</label>
      <input type="text" id="issueWO" placeholder="Work order or equipment...">
    </div>
    <div class="form-row">
      <label>Notes</label>
      <textarea id="issueNotes" placeholder="Optional notes..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-red" onclick="closeModals()">Cancel</button>
      <button class="btn btn-blue" onclick="issueStock()">✅ Issue</button>
    </div>
  </div>
</div>

<!-- Receive Stock -->
<div class="overlay" id="receiveOverlay">
  <div class="modal">
    <h2>➕ Receive Stock</h2>
    <div class="form-row">
      <label>Material</label>
      <select id="receiveMat"></select>
    </div>
    <div class="form-row">
      <label>Quantity Received</label>
      <input type="number" id="receiveQty" min="1" value="1">
    </div>
    <div class="form-row">
      <label>Supplier / Source</label>
      <input type="text" id="receiveSupplier" placeholder="Supplier name...">
    </div>
    <div class="form-row">
      <label>Notes</label>
      <textarea id="receiveNotes" placeholder="Optional notes..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-red" onclick="closeModals()">Cancel</button>
      <button class="btn btn-green" onclick="receiveStock()">✅ Receive</button>
    </div>
  </div>
</div>

// ═══════════════ STATE ═══════════════
var items = [];
var transactions = [];
var activeTab = 'inventory';
var loggedUser = null;

function loadState(){
  try{
    var si = localStorage.getItem('wh_items');
    var st = localStorage.getItem('wh_tx');
    items = si ? JSON.parse(si) : JSON.parse(JSON.stringify(ITEMS_SEED));
    transactions = st ? JSON.parse(st) : [];
  }catch(e){
    items = JSON.parse(JSON.stringify(ITEMS_SEED));
    transactions = [];
  }
}
function saveState(){
  try{
    localStorage.setItem('wh_items', JSON.stringify(items));
    localStorage.setItem('wh_tx', JSON.stringify(transactions));
  }catch(e){}
}
function getUser(){
  var raw = sessionStorage.getItem('cmms_user')||localStorage.getItem('cmms_user');
  if(!raw) return null;
  try{return JSON.parse(raw);}catch(e){return null;}
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='CMMS_USER'){
    try{
      var u=JSON.parse(e.data.data);
      if(u&&u.name){sessionStorage.setItem('cmms_user',e.data.data);init();}
    }catch(err){}
  }
});

// ═══════════════ INIT ═══════════════
function init(){
  loadState();
  loggedUser = getUser();
  if(loggedUser && loggedUser.name){
    document.getElementById('userBadge').textContent = '👷 '+loggedUser.name;
    document.getElementById('issueTech').value = loggedUser.name;
  }
  renderStats();
  renderInventory();
  populateSelects();
}
function goBack(){
  if(window.parent && window.parent !== window){window.parent.postMessage({type:'BACK'},'*');}
  else if(document.referrer){window.history.back();}
  else{window.location.href='index.html';}
}

// ═══════════════ STATS ═══════════════
function renderStats(){
  var total=items.length, zero=0, low=0, ok=0;
  items.forEach(function(it){
    if(it.nett<=0) zero++;
    else if(it.nett<=it.min_stock) low++;
    else ok++;
  });
  var totalQty = items.reduce(function(s,it){return s+it.nett;},0);
  document.getElementById('statsBar').innerHTML=
    '<div class="stat-box"><div class="val">'+total+'</div><div class="lbl">Total Items</div></div>'+
    '<div class="stat-box green"><div class="val">'+ok+'</div><div class="lbl">✅ In Stock</div></div>'+
    '<div class="stat-box orange"><div class="val">'+low+'</div><div class="lbl">⚠️ Low Stock</div></div>'+
    '<div class="stat-box red"><div class="val">'+zero+'</div><div class="lbl">🔴 Zero Stock</div></div>'+
    '<div class="stat-box"><div class="val">'+transactions.length+'</div><div class="lbl">Transactions</div></div>';
}

// ═══════════════ TABS ═══════════════
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach(function(t,i){
    t.classList.toggle('active', ['inventory','transactions','alerts','request'][i]===tab);
  });
  var showTB = (tab==='inventory');
  document.getElementById('toolbar').style.display = showTB?'flex':'none';
  if(tab==='inventory') renderInventory();
  else if(tab==='transactions') renderTransactions();
  else if(tab==='alerts') renderAlerts();
  else if(tab==='request') openIssueModal();
}

// ═══════════════ INVENTORY TABLE ═══════════════
function stockStatus(it){
  if(it.nett<=0) return '<span class="badge badge-red">🔴 Zero</span>';
  if(it.nett<=it.min_stock) return '<span class="badge badge-orange">⚠️ Low</span>';
  return '<span class="badge badge-green">✅ OK</span>';
}
function renderInventory(){
  var q=(document.getElementById('searchBox').value||'').toLowerCase();
  var cat=document.getElementById('catFilter').value;
  var sf=document.getElementById('stockFilter').value;
  var filtered=items.filter(function(it){
    if(q && it.name.toLowerCase().indexOf(q)<0) return false;
    if(cat && it.category!==cat) return false;
    if(sf==='low' && !(it.nett>0 && it.nett<=it.min_stock)) return false;
    if(sf==='zero' && it.nett>0) return false;
    if(sf==='ok' && !(it.nett>it.min_stock)) return false;
    return true;
  });
  var h='<div class="tbl-wrap"><table>';
  h+='<tr><th>#</th><th>Material Name</th><th>Category</th><th>Opening</th><th>Received</th><th>Current Stock</th><th>Unit</th><th>Min</th><th>Status</th><th class="no-print">Actions</th></tr>';
  filtered.forEach(function(it){
    h+='<tr>';
    h+='<td>'+it.id+'</td>';
    h+='<td><b>'+it.name+'</b></td>';
    h+='<td><span class="cat-chip">'+it.category+'</span></td>';
    h+='<td>'+it.opening+'</td>';
    h+='<td>'+it.in_stock+'</td>';
    h+='<td><b style="font-size:15px;color:'+(it.nett<=0?'#c62828':it.nett<=it.min_stock?'#e65100':'#2e7d32')+'">'+it.nett+'</b></td>';
    h+='<td>'+it.unit+'</td>';
    h+='<td>'+it.min_stock+'</td>';
    h+='<td>'+stockStatus(it)+'</td>';
    h+='<td class="no-print" style="white-space:nowrap">';
    h+='<button class="btn btn-red" style="padding:4px 8px;font-size:11px" onclick="quickIssue('+it.id+')">📤</button> ';
    h+='<button class="btn btn-green" style="padding:4px 8px;font-size:11px" onclick="quickReceive('+it.id+')">➕</button> ';
    h+='<button class="btn" style="padding:4px 8px;font-size:11px;background:#1565c0;color:#fff" onclick="openEditModal('+it.id+')">✏️</button> ';
    h+='<button class="btn" style="padding:4px 8px;font-size:11px;background:#b71c1c;color:#fff" onclick="deleteItem('+it.id+')">🗑️</button>';
    h+='</td>';
    h+='</tr>';
  });
  h+='</table></div>';
  document.getElementById('content').innerHTML=h;
}

// ═══════════════ TRANSACTIONS ═══════════════
function renderTransactions(){
  var h='<div style="padding:12px">';
  if(!transactions.length){h+='<p style="color:#888;text-align:center;padding:40px">No transactions yet.</p></div>';document.getElementById('content').innerHTML=h;return;}
  var sorted=[].concat(transactions).reverse();
  sorted.forEach(function(tx){
    var icon=tx.type==='out'?'📤':'📥';
    var color=tx.type==='out'?'#c62828':'#2e7d32';
    h+='<div class="tx-item '+tx.type+'">';
    h+='<div class="tx-head">'+icon+' '+tx.itemName+' — <span style="color:'+color+'">'+(tx.type==='out'?'-':'+')+''+tx.qty+' '+tx.unit+'</span></div>';
    h+='<div class="tx-sub">'+new Date(tx.ts).toLocaleString()+' | Tech: '+tx.tech+' | '+tx.note+'</div>';
    h+='</div>';
  });
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

// ═══════════════ ALERTS ═══════════════
function renderAlerts(){
  var low=items.filter(function(it){return it.nett<=it.min_stock;});
  var zeros=low.filter(function(it){return it.nett<=0;});
  var warns=low.filter(function(it){return it.nett>0;});
  var h='<div style="padding:12px">';
  if(!low.length){h+='<p style="color:#2e7d32;font-weight:700;text-align:center;padding:40px">✅ All items are adequately stocked!</p></div>';document.getElementById('content').innerHTML=h;return;}
  if(zeros.length){
    h+='<h3 style="color:#c62828;margin-bottom:8px">🔴 Zero Stock ('+zeros.length+' items)</h3>';
    zeros.forEach(function(it){
      h+='<div class="alert-card critical"><div><div class="al-name">'+it.name+'</div><div class="al-qty">Current: 0 '+it.unit+' | Min: '+it.min_stock+' | Category: '+it.category+'</div></div></div>';
    });
  }
  if(warns.length){
    h+='<h3 style="color:#e65100;margin:16px 0 8px">⚠️ Low Stock ('+warns.length+' items)</h3>';
    warns.forEach(function(it){
      h+='<div class="alert-card"><div><div class="al-name">'+it.name+'</div><div class="al-qty">Current: '+it.nett+' '+it.unit+' | Min: '+it.min_stock+' | Need: '+(it.min_stock-it.nett)+' more</div></div></div>';
    });
  }
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

// ═══════════════ MODALS ═══════════════
function populateSelects(){
  var opts=items.map(function(it){return '<option value="'+it.id+'">'+it.id+'. '+it.name+'</option>';}).join('');
  document.getElementById('issueMat').innerHTML=opts;
  document.getElementById('receiveMat').innerHTML=opts;
}
function openIssueModal(){
  document.getElementById('issueOverlay').classList.add('show');
  if(loggedUser&&loggedUser.name) document.getElementById('issueTech').value=loggedUser.name;
  document.getElementById('issueQty').value=1;
  document.getElementById('issueWO').value='';
  document.getElementById('issueNotes').value='';
  activeTab='inventory';
}
function openReceiveModal(){
  document.getElementById('receiveOverlay').classList.add('show');
  document.getElementById('receiveQty').value=1;
  document.getElementById('receiveSupplier').value='';
  document.getElementById('receiveNotes').value='';
}
function closeModals(){
  document.getElementById('issueOverlay').classList.remove('show');
  document.getElementById('receiveOverlay').classList.remove('show');
  document.getElementById('editOverlay').classList.remove('show');
  document.getElementById('addItemOverlay').classList.remove('show');
}
function quickIssue(id){
  document.getElementById('issueMat').value=id;
  openIssueModal();
}
function quickReceive(id){
  document.getElementById('receiveMat').value=id;
  openReceiveModal();
}
function issueStock(){
  var id=parseInt(document.getElementById('issueMat').value);
  var qty=parseInt(document.getElementById('issueQty').value)||1;
  var tech=document.getElementById('issueTech').value.trim()||'Unknown';
  var wo=document.getElementById('issueWO').value.trim();
  var notes=document.getElementById('issueNotes').value.trim();
  var it=items.find(function(i){return i.id===id;});
  if(!it){alert('Item not found!');return;}
  if(qty>it.nett){alert('Not enough stock! Available: '+it.nett+' '+it.unit);return;}
  it.nett-=qty;
  transactions.push({type:'out',itemId:id,itemName:it.name,qty:qty,unit:it.unit,tech:tech,note:wo+(notes?' — '+notes:''),ts:Date.now()});
  saveState();
  renderStats();
  closeModals();
  alert('✅ Issued '+qty+' '+it.unit+' of\n'+it.name+'\nto '+tech);
  renderInventory();
}
function receiveStock(){
  var id=parseInt(document.getElementById('receiveMat').value);
  var qty=parseInt(document.getElementById('receiveQty').value)||1;
  var sup=document.getElementById('receiveSupplier').value.trim()||'—';
  var notes=document.getElementById('receiveNotes').value.trim();
  var it=items.find(function(i){return i.id===id;});
  if(!it){alert('Item not found!');return;}
  it.nett+=qty;
  it.in_stock+=qty;
  transactions.push({type:'in',itemId:id,itemName:it.name,qty:qty,unit:it.unit,tech:loggedUser&&loggedUser.name?loggedUser.name:'Store',note:'From: '+sup+(notes?' — '+notes:''),ts:Date.now()});
  saveState();
  renderStats();
  closeModals();
  alert('✅ Received '+qty+' '+it.unit+' of\n'+it.name);
  renderInventory();
}

// ═══════════════ PRINT ═══════════════
function printInventory(){
  window.print();
}


// ═══════════════ EDIT ITEM ═══════════════
function openEditModal(id){
  var it=items.find(function(i){return i.id===id;});
  if(!it)return;
  document.getElementById('editId').value=id;
  document.getElementById('editName').value=it.name;
  document.getElementById('editCat').value=it.category;
  document.getElementById('editNett').value=it.nett;
  document.getElementById('editMin').value=it.min_stock;
  document.getElementById('editUnit').value=it.unit;
  document.getElementById('editOverlay').classList.add('show');
}
function saveEdit(){
  var id=parseInt(document.getElementById('editId').value);
  var it=items.find(function(i){return i.id===id;});
  if(!it)return;
  var name=document.getElementById('editName').value.trim();
  if(!name){alert('Name is required!');return;}
  it.name=name;
  it.category=document.getElementById('editCat').value;
  it.nett=parseFloat(document.getElementById('editNett').value)||0;
  it.min_stock=parseFloat(document.getElementById('editMin').value)||0;
  it.unit=document.getElementById('editUnit').value;
  saveState();
  populateSelects();
  renderStats();
  closeModals();
  renderInventory();
}

// ═══════════════ DELETE ITEM ═══════════════
function deleteItem(id){
  var it=items.find(function(i){return i.id===id;});
  if(!it)return;
  if(!confirm('🗑️ Delete "'+it.name+'"?\nThis cannot be undone.'))return;
  items=items.filter(function(i){return i.id!==id;});
  saveState();
  populateSelects();
  renderStats();
  renderInventory();
}

// ═══════════════ ADD NEW ITEM ═══════════════
function openAddItemModal(){
  document.getElementById('addName').value='';
  document.getElementById('addOpening').value='0';
  document.getElementById('addMin').value='3';
  document.getElementById('addUnit').value='pcs';
  document.getElementById('addItemOverlay').classList.add('show');
}
function saveNewItem(){
  var name=document.getElementById('addName').value.trim();
  if(!name){alert('Material name is required!');return;}
  var maxId=items.reduce(function(m,i){return Math.max(m,i.id);},0);
  var opening=parseFloat(document.getElementById('addOpening').value)||0;
  var newItem={
    id:maxId+1,
    name:name,
    category:document.getElementById('addCat').value,
    opening:opening,
    in_stock:0,
    nett:opening,
    monthly_avg:0,
    unit:document.getElementById('addUnit').value,
    min_stock:parseFloat(document.getElementById('addMin').value)||3
  };
  items.push(newItem);
  saveState();
  populateSelects();
  renderStats();
  closeModals();
  renderInventory();
  alert('✅ Item added: '+name);
}

// ═══════════════ CLOSE ON BG CLICK ═══════════════
document.getElementById('issueOverlay').addEventListener('click',function(e){if(e.target===this)closeModals();});
document.getElementById('receiveOverlay').addEventListener('click',function(e){if(e.target===this)closeModals();});
document.getElementById('editOverlay').addEventListener('click',function(e){if(e.target===this)closeModals();});
document.getElementById('addItemOverlay').addEventListener('click',function(e){if(e.target===this)closeModals();});

// ═══════════════ START ═══════════════
init();
</script>

          <option value="pcs">pcs</option>
          <option value="M">M (Meter)</option>
          <option value="Cyl">Cyl (Cylinder)</option>
          <option value="Kg">Kg</option>
          <option value="L">L (Liter)</option>
          <option value="Roll">Roll</option>
          <option value="Box">Box</option>
          <option value="Set">Set</option>
        </select>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-red" onclick="closeModals()">Cancel</button>
      <button class="btn btn-green" onclick="saveNewItem()">✅ Add Item</button>
    </div>
  </div>
</div>
</body>
</html>
